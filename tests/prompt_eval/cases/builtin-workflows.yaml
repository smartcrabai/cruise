cases:
  - id: tdd-write-tests
    target: {workflow_step: {path: builtin/tdd.yaml, step: write-test-first}}
    render: step
    output: workspace_diff
    workspace: tests/prompt_eval/fixtures/addition
    vars: {plan: {file: tests/prompt_eval/fixtures/sample/plan.md}}
    checks: [{min_chars: 20}]
    rubric: [{id: tdd-write-tests-quality, text: 'The diff adds meaningful tests for checked addition without unrelated production changes.'}]
