# jcode SDK backend example: no external command; jcode-sdk drives prompts
# through a local API bridge. A compatible jcode CLI is required.
sdk: jcode

description: SDK-backed TDD flow

# Every actual jcode prompt needs an effective model. Set one here, in
# applicable defaults, or through CRUISE_MODEL / CRUISE_PLAN_MODEL.
# Use a route available in your jcode setup.
# model: provider/model[:effort]

steps:
  write-tests:
    prompt: |
      Write tests for {plan}. Do not implement yet.

  implement:
    # A per-step model may be set to override top-level model settings.
    prompt: |
      Tests are written for {plan}. Implement to make them pass.
    timeout: 30m
    if:
      no-file-changes: failed

  test:
    command:
      - cargo fmt --all
      - cargo test

  fix-test-error:
    # Reached sequentially after `test`, pass or fail (a failed command step
    # does not abort the run; prev.success = "true" -> skipped).
    skip: prev.success
    prompt: |
      The following error occurred. Please correct it:
      ---
      {prev.stderr}
    next: test
