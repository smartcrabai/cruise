[package]
description = "YAML-driven coding agent workflow orchestrator"
edition = "2024"
license = "MIT"
name = "cruise"
repository = "https://github.com/smartcrabai/cruise"
rust-version = "1.95"
version.workspace = true

[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.8"

# Config for 'dist'
[workspace.metadata.dist]
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "smartcrabai/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Whether to install an updater program
install-updater = false

[features]
test-utils = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.5.60", features = ["derive"] }
console = "0.16.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
encre-css = "0.21"
futures = "0.3"
glob = "0.3"
home = "0.5"
include_dir = "0.7"
indexmap = { version = "2.13.0", features = ["serde"] }
inquire = "0.9"
jsxrs = "0.1.5"
pulldown-cmark = { version = "0.13", default-features = false, features = [
  "html",
] }
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reedline = "0.51"
seher-claude-agent-sdk = "=0.0.59"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "rt",
  "macros",
  "net",
  "process",
  "io-util",
  "time",
  "signal",
  "sync",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tui-markdown = { version = "0.3.9", default-features = false }
uuid = { version = "1.23.3", features = ["v4"] }
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
users = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
notify-rust = "=4.18.0"

[dev-dependencies]
tempfile = "=3.27.0"
vt100 = "=0.16.2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[patch.crates-io]
seher-claude-agent-sdk = { path = "vendor/claude-agent-sdk" }
