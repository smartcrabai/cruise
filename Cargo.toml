[package]
autobins = false
default-run = "cruise"
description = "YAML-driven coding agent workflow orchestrator"
edition = "2024"
license = "MIT"
name = "cruise"
publish = false
repository = "https://github.com/smartcrabai/cruise"
rust-version = "1.95"
version.workspace = true

# `publish = false` would otherwise make dist skip this package.
[package.metadata.dist]
dist = true

[[bin]]
name = "cruise"
path = "src/launcher.rs"

[[bin]]
name = "cruise-runtime"
path = "src/main.rs"

[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.18"

# Config for 'dist'
[workspace.metadata.dist]
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "smartcrabai/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
# Whether to install an updater program
install-updater = false

[features]
test-utils = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.5.60", features = ["derive"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
console = "0.16.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
encre-css = "0.21"
fs2 = "0.4.3"
futures = "0.3"
glob = "0.3"
home = "0.5"
include_dir = "0.7"
indexmap = { version = "2.13.0", features = ["serde"] }
inquire = "0.9"
jcode-sdk = { git = "https://github.com/1jehuang/jcode", tag = "v0.99.0" }
json5 = "=0.4.1"
jsxrs = "0.1.6"
opentelemetry = { version = "0.33.1", default-features = false, features = [
  "trace",
  "metrics",
] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "http-proto",
  "gzip-http",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "metrics",
] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
  "trace",
  "metrics",
] }
pulldown-cmark = { version = "0.13", default-features = false, features = [
  "html",
] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
reedline = "0.52"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
seher-claude-agent-sdk = "=0.0.59"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tar = "0.4"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "rt",
  "macros",
  "net",
  "process",
  "io-util",
  "time",
  "signal",
  "sync",
] }
toml = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tui-markdown = { version = "0.3.9", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
uuid = { version = "1.23.3", features = ["v4"] }
walkdir = "2.5.0"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
users = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
notify-rust = "=4.18.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
cucumber = "=0.23.0"
opentelemetry-proto = { version = "0.33.1", features = [
  "gen-tonic-messages",
  "trace",
  "metrics",
] }
portable-pty = "=0.9.0"
prost = "0.14"
tempfile = "=3.27.0"
vt100 = "=0.18.1"

[[test]]
harness = false
name = "workflow_flags_bdd"
path = "tests/workflow_flags_bdd.rs"
test = false

[[test]]
harness = false
name = "checkpoint_bdd"
path = "tests/checkpoint_bdd.rs"

[[test]]
harness = false
name = "opencode_bdd"
path = "tests/opencode_bdd.rs"
# POSIX fixture: required explicitly by check_opencode_specs.sh on Linux CI.
# Do not implicitly run an unavailable platform check in the Windows suite.
test = false

[[test]]
harness = false
name = "sdk_model_bdd"
path = "tests/sdk_model_bdd.rs"
# POSIX SDK subprocess fixtures, explicitly runnable with --test sdk_model_bdd.
test = false

[[test]]
harness = false
name = "agent_auth_bdd"
path = "tests/agent_auth_bdd.rs"
# Unix SDK subprocess boundary fixtures, explicitly runnable on supported hosts.
test = false

[[test]]
harness = false
name = "webui_responsive_bdd"
path = "tests/webui_responsive_bdd.rs"
# Requires the pinned browser package and Chromium, see tests/webui/README.md.
test = false

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"

[lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[patch.crates-io]
seher-claude-agent-sdk = { path = "vendor/claude-agent-sdk" }
