# Most tests wait on subprocesses and timers (about 1.5 busy cores at 6 test
# threads), so CI runs more tests at once than its 3-4 cores.
[profile.ci]
test-threads = 8

# These suites serialize their tests with in-process locks; nextest runs each
# test in its own process, so keep them one at a time.
[test-groups]
file-artifacts-cli = { max-threads = 1 }
model-logging-cli = { max-threads = 1 }
planning-spinner-pty = { max-threads = 1 }
run-prompts-pty = { max-threads = 1 }
# Manager tests spawn isolated daemons; avoid saturating CI with concurrent servers.
manager-integration = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary_id(=cruise::file_artifacts_cli)"
test-group = "file-artifacts-cli"

[[profile.default.overrides]]
filter = "binary_id(=cruise::model_logging_cli)"
test-group = "model-logging-cli"

[[profile.default.overrides]]
filter = "binary_id(=cruise::planning_spinner_pty)"
test-group = "planning-spinner-pty"

[[profile.default.overrides]]
filter = "binary_id(=cruise::run_prompts_pty)"
test-group = "run-prompts-pty"

[[profile.default.overrides]]
filter = """
binary_id(=cruise::manager_approval_bdd)
| binary_id(=cruise::manager_approval_dispatch_acceptance)
| binary_id(=cruise::manager_cli)
| binary_id(=cruise::manager_conversation_restart_acceptance)
| binary_id(=cruise::manager_corrections)
| binary_id(=cruise::manager_corrective_approval)
| binary_id(=cruise::manager_corrective_lifecycle_acceptance)
| binary_id(=cruise::manager_corrupt_daemon_isolation)
| binary_id(=cruise::manager_daemon_api)
| binary_id(=cruise::manager_dependency_acceptance)
| binary_id(=cruise::manager_forge_lifecycle)
| binary_id(=cruise::manager_git_integration)
| binary_id(=cruise::manager_ownership_boundary)
| binary_id(=cruise::manager_proposal_contract)
| binary_id(=cruise::manager_reservation_publication)
| binary_id(=cruise::manager_resume_recovery)
| binary_id(=cruise::manager_terminal_pty)
| binary_id(=cruise::manager_verification_retry)
"""
test-group = "manager-integration"

# Start the suites whose tests take 15-90 seconds on some CI platform first, so
# they do not finish last.
[[profile.default.overrides]]
filter = """
binary_id(=cruise::diff_cli) | binary_id(=cruise::branch_diff)
| binary_id(=cruise::workflow_defaults_cli) | binary_id(=cruise::local_merge_application)
| binary_id(=cruise::pr_review_fix_bdd) | binary_id(=cruise::plan_approve_cancel)
"""
priority = 100
