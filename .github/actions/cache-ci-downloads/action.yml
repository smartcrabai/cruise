name: Cache CI downloads
description: Cache verified CI downloads and pinned toolchains.
inputs:
  rust-components:
    description: Rust toolchain components included in the cache key.
    required: false
    default: minimal
  save-rust-dependencies:
    description: Save shared Linux Rust dependencies on main.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Cache checksum-pinned Node.js archive
      if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/node-v26.13.1-linux-x64.tar.xz
        key: node-v1-${{ runner.os }}-${{ runner.arch }}-26.13.1-5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864
    - name: Install checksum-verified Node.js toolchain
      if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      shell: bash
      run: |
        version=26.13.1
        digest=5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864
        archive="$RUNNER_TEMP/node-v$version-linux-x64.tar.xz"
        if [[ ! -f "$archive" ]] || [[ $(sha256sum "$archive" | awk '{print $1}') != "$digest" ]]; then
          rm -f "$archive"
          curl --fail --location --silent --show-error --retry 3 \
            "https://nodejs.org/dist/v$version/node-v$version-linux-x64.tar.xz" \
            -o "$archive.part"
          printf '%s  %s\n' "$digest" "$archive.part" | sha256sum --check --status
          mv "$archive.part" "$archive"
        fi
        tool="$RUNNER_TOOL_CACHE/node/$version/x64"
        rm -rf "$tool"
        mkdir -p "$tool"
        tar -xJf "$archive" --strip-components=1 -C "$tool"
        touch "${tool}.complete"
    - name: Cache and validate Rust toolchain
      uses: ./.github/actions/cache-rust-toolchain
      with:
        components: ${{ inputs.rust-components }}
    - name: Cache shared Linux Rust dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: linux-specs
        cmd-format: rustup run 1.99.1 {0}
        save-if: ${{ inputs.save-rust-dependencies == 'true' && github.ref == 'refs/heads/main' }}
    - name: Cache checksum-pinned formal downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/cruise-formal-tools/*.tar.gz
          ${{ runner.temp }}/cruise-formal-tools/alloy-6.2.0.jar
        key: formal-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_formal.sh', 'scripts/check_instruction_inbox_alloy.sh') }}
    - name: Cache checksum-pinned Apalache distribution
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.quint/cache/apalache-0.62.1.tgz
        key: apalache-v1-${{ runner.os }}-${{ runner.arch }}-0.62.1-38202a8c4ebeb3ab73e0fe5a7e4bb948442d46ad5de8a7fb45c9e5cac2beb2a6
