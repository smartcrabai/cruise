name: Exec recovery specifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exec-recovery-specs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exec-recovery-specs:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-ci-downloads
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json
      - name: Install pinned PTY test runners
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats=1.13.0-1 expect=5.45.4-4build1 tcl-expect=5.45.4-4build1
      - name: Run exec recovery specifications
        run: bash scripts/check_exec_recovery_specs.sh
      - name: Upload model and scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exec-recovery-spec-reports
          path: target/formal-reports/exec-recovery*/
          if-no-files-found: error
          retention-days: 14
