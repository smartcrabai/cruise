name: List action specifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: list-actions-specs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json
      - name: Typecheck, test, simulate and verify Quint, then check Alloy receipts
        run: bash scripts/check_list_actions_specs.sh
      - name: Upload model reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: list-action-model-reports
          path: target/formal-reports/list-actions.*/
          if-no-files-found: error
          retention-days: 14

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run production Gherkin scenarios
        run: cargo test --locked --all-features --test list_actions_bdd
      - name: Run selector and related CLI regressions
        if: '!cancelled()'
        run: |
          cargo test --locked --all-features --lib list_cmd::tests
          cargo test --locked --all-features --test list_actions_pty --test list_generate_plan --test planning_spinner_pty --test run_lifecycle_cli --test daemon_list_api --test skip_planning_state --test ui_language_catalog --test ui_language_cli --test ssh_entrypoint
      - name: Check Rust formatting
        if: '!cancelled()'
        run: cargo fmt -- --check
      - name: Run repository Clippy checks
        if: '!cancelled()'
        # Match the main CI lint toolchain. The scenario and format checks stay pinned.
        run: |
          rustup update stable
          cargo +stable clippy --all-targets --all-features -- -D warnings -A clippy::large_futures
