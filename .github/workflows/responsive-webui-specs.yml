name: Responsive WebUI specifications

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-webui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  responsive-webui-specs:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache CI downloads
        uses: ./.github/actions/cache-ci-downloads
        with:
          rust-components: minimal-clippy-rustfmt
          save-rust-dependencies: 'true'
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('tests/webui/package-lock.json') }}
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: |
            tests/formal/package-lock.json
            tests/webui/package-lock.json
      - name: Responsive and Planning keyboard specifications (Quint, Alloy and Chromium Gherkin)
        run: bash scripts/check_responsive_webui_specs.sh
      - name: Production graph and Diff browser tests
        run: |
          cargo +1.99.1 build --locked --all-features --bin cruise-runtime
          node tests/webui/graph-flags.mjs
          node tests/webui/diff-browser.mjs
      - name: Production Option dialog browser test
        run: node tests/webui/option-dialog.mjs
      - name: Production locale browser test
        run: |
          node tests/webui/language.mjs
          node tests/webui/sse-language.mjs
      - name: Verify WebUI browser boundaries
        run: node tests/webui/verify-boundary.mjs
      - name: Production Tell browser test
        run: |
          node tests/webui/tell-dialog.mjs
          node tests/webui/tell-negative.mjs
      - name: Auto-requeue WebUI browser test
        run: |
          node tests/webui/auto-requeue.mjs all
          node tests/webui/auto-requeue.mjs header
      - name: PR retry real browser boundaries
        run: node tests/webui/pr-failed-real.mjs
      - name: Production PR form browser test
        run: node tests/webui/pr-form.mjs
      - name: Production exec browser test
        run: node tests/webui/exec-browser.mjs
      - name: Production local merge browser test
        run: node tests/webui/local-merge.mjs
      - name: Production workflow category browser test
        run: node tests/webui/workflow-categories.mjs
      - name: Managed-child WebUI browser boundary
        run: node tests/webui/managed-child.mjs
      - name: Workflow flag buttons browser regression
        run: node tests/webui/flag-buttons.mjs
      - name: Failed exec stays out of WebUI inventory
        run: node tests/webui/exec-recovery-inventory.mjs
      - name: Production notification browser test
        run: node tests/webui/notifications.mjs
      - name: Upload specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: responsive-webui-spec-reports
          path: target/formal-reports/
          if-no-files-found: error
          retention-days: 14
