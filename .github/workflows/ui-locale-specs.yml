name: UI locale specifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-locale-specs:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run locale specifications
        run: bash scripts/check_ui_locale_specs.sh
      - name: Upload specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-locale-spec-reports
          path: target/formal-reports/ui-locale.*/
          if-no-files-found: error
          retention-days: 14
