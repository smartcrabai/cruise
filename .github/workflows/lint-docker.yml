name: Lint Docker

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/lint-docker.yml'
      - 'scripts/test_docker_config.sh'

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Docker config file structure
        run: bash scripts/test_docker_config.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint Dockerfile with hadolint
        # Ignores DL3008 (pin apt package versions) - versions are managed by
        # the base image; DL3009 (delete apt lists) is handled in the same RUN.
        run: |
          docker run --rm \
            -v "$PWD/Dockerfile:/Dockerfile:ro" \
            hadolint/hadolint:v2.12.0 \
            hadolint \
              --ignore DL3008 \
              /Dockerfile

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache checksum-pinned actionlint archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/actionlint/actionlint_1.7.7_linux_amd64.tar.gz
          key: actionlint-v1-1.7.7-linux-x64-023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/actionlint"
          archive="$RUNNER_TEMP/actionlint/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          if [[ ! -f "$archive" ]] || [[ $(sha256sum "$archive" | cut -d ' ' -f 1) != "$ACTIONLINT_SHA256" ]]; then
            rm -f "$archive"
            curl -fsSL --retry 3 \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
              -o "$archive.part"
            printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive.part" | sha256sum --check --status
            mv "$archive.part" "$archive"
          fi
          tar -xz -C "$RUNNER_TEMP/bin" -f "$archive" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint workflow files with actionlint
        run: actionlint .github/workflows/docker-publish.yml .github/workflows/lint-docker.yml
