name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: taplo-cli

      - name: Lint Cargo.toml
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Verify vendored crate integrity
        run: bash scripts/verify_vendored_crate.sh

      - name: Test GitHub Action step scripts
        run: |
          status=0
          log="$RUNNER_TEMP/action-suite.log"
          for suite in scripts/test_action_*.sh; do
            echo "== $suite"
            bash "$suite" > "$log" 2>&1 || status=1
            cat "$log"
            # A suite that dies mid-run (parse error, unset variable) never
            # reaches its `finish` call, so the tally line is the only proof
            # that every case actually executed.
            if ! grep -q '^Results:' "$log"; then
              echo "::error::$suite exited without a Results line -- it aborted before finishing"
              status=1
            fi
          done
          exit "$status"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        # Workflow command/plan futures intentionally retain their full state;
        # keep the stable lint set strict without making this size heuristic a
        # release blocker when Clippy changes its threshold.
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::large_futures

      - name: Run tests
        run: cargo test --all-features

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check Windows target
        run: cargo check --all-targets --all-features --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --all-features

      - name: Test action config install script
        shell: bash
        run: bash scripts/test_action_config_install.sh
