name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  subagent-model-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: subagent-model-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Subagent Quint, Alloy receipts and production Gherkin
        run: bash scripts/check_subagent_model_specs.sh

      - name: Upload subagent specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subagent-model-spec-reports
          path: target/formal-reports/subagent-model.*/
          if-no-files-found: error
          retention-days: 14

  tool-restrictions-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            tests/formal/package-lock.json
            tests/formal/opencode-cli/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: tool-restrictions-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Tool restrictions Quint, Alloy receipts and production Gherkin
        run: bash scripts/check_tool_restrictions_specs.sh

      - name: Upload tool restriction specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tool-restrictions-spec-reports
          path: target/formal-reports/tool-restrictions.*/
          if-no-files-found: error
          retention-days: 14

  opencode-effort-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: |
            tests/formal/package-lock.json
            tests/formal/opencode-cli/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: opencode-effort-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Effort formal models, production Gherkin and real CLI
        run: bash scripts/check_opencode_effort_specs.sh

      - name: Upload effort specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opencode-effort-spec-reports
          path: target/formal-reports/opencode-effort.*/
          if-no-files-found: error
          retention-days: 14

  agent-auth-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: agent-auth-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Auth preflight Quint, Alloy receipts and production Gherkin
        run: bash scripts/check_agent_auth_specs.sh

      - name: Upload authentication specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-auth-spec-reports
          path: target/formal-reports/agent-auth.*/
          if-no-files-found: error
          retention-days: 14

  workflow-flags-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: workflow-flags-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Execution and skip-selection Quint, Alloy receipts and production Gherkin
        run: bash scripts/check_workflow_flags_specs.sh

      - name: Upload workflow flag specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflow-flags-spec-reports
          path: target/formal-reports/workflow-flags.*/
          if-no-files-found: error
          retention-days: 14

  sdk-model-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sdk-model-specs
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: SDK-qualified models, Alloy receipts and production Gherkin
        run: bash scripts/check_sdk_model_specs.sh

      - name: Upload SDK specification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-model-spec-reports
          path: target/formal-reports/sdk-models.*/
          if-no-files-found: error
          retention-days: 14

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: tests/formal/package-lock.json

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Formal models and checkpoint behavior
        run: scripts/check_formal.sh

      - name: OpenCode V2 Quint, Alloy and production BDD contracts
        if: ${{ !cancelled() }}
        run: bash scripts/check_opencode_specs.sh

      - name: Upload formal reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formal-reports
          path: target/formal-reports/
          if-no-files-found: warn
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: taplo-cli

      - name: Lint Cargo.toml
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Verify vendored crate integrity
        run: bash scripts/verify_vendored_crate.sh

      - name: Test GitHub Action step scripts
        run: |
          status=0
          log="$RUNNER_TEMP/action-suite.log"
          for suite in scripts/test_action_*.sh; do
            echo "== $suite"
            bash "$suite" > "$log" 2>&1 || status=1
            cat "$log"
            # A suite that dies mid-run (parse error, unset variable) never
            # reaches its `finish` call, so the tally line is the only proof
            # that every case actually executed.
            if ! grep -q '^Results:' "$log"; then
              echo "::error::$suite exited without a Results line -- it aborted before finishing"
              status=1
            fi
          done
          exit "$status"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        # Workflow command/plan futures intentionally retain their full state;
        # keep the stable lint set strict without making this size heuristic a
        # release blocker when Clippy changes its threshold.
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::large_futures

      - name: Run tests
        run: cargo test --all-features

      - name: Smoke native update with real A/B binaries
        run: python3 scripts/test_update_smoke.py --build

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check Windows target
        run: cargo check --all-targets --all-features --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --all-features

      - name: Smoke native update with real A/B binaries
        run: python scripts/test_update_smoke.py --build

      - name: Test action config install script
        shell: bash
        run: bash scripts/test_action_config_install.sh
