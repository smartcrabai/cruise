      A="$(dirname '{plan}')/artifacts"; cp "$A/apply-r3.md" "$A/analysis/apply-output.md"
      {cruise.bin} internal tdd-ledger-snapshot
    env:
      CRUISE_TDD_LEDGER_PLAN: '{plan}'
