description: Add executable, production-grounded Quint, Alloy, and Gherkin specifications with CI
force_exec: true
flags:
  after_pr:
    description: Run pull-request or merge-request readiness, synchronization, and CI follow-up
  merge:
    description: Run after-PR follow-up and perform a host-managed squash merge

steps:
  audit:
    output_file: formal-specs/audit.md
    prompt: |-
      Add executable, production-grounded Quint, Alloy, and Gherkin specifications plus provider-native CI. Request: {input}
      Plan: {plan}. Use it only if non-empty, approved, and relevant; then refine scope, constraints, and criteria. Otherwise, including exec mode, rely on the request without implying approval.

      Audit only; no edits/checks. Inspect the working tree first and preserve existing changes. Review authoritative requirements/contracts, public behavior, production paths/callers, tests, manifests/locks, and CI workflows/provider; prefer stronger contracts to conflicting implementation.
      Choose one cohesive, evidenced consumer-visible state machine. For each requirement record a stable ID, source evidence, implementing entrypoint/transition, and existing tests; include specified success/boundary/rejected transitions and flag ambiguity or unsupported rules.
      Identify language/framework/runtimes, package/lockfile, CI provider/triggers, test/artifact setup, and integration-test location/execution. Check official docs and pinned compatibility for Quint, Alloy CLI/JAR, JDK, and Gherkin runner/version; do not assume JavaScript or add a manager just for Gherkin.
      Begin the report with effective scope/constraints/criteria (relevant approved-plan refinements, or state none and derive from the request without implying approval), then IDs/evidence, behavior/entrypoint, code/model map, conventions, likely files, bound candidates, and prerequisites. Exclude prose-only specs, toy models, formal CLI modes/flags, and unrelated work. Never ask the user.
  model:
    output_file: formal-specs/model.md
    prompt: |-
      Original request: {input}

      <audit-report>
      {file:formal-specs/audit.md}
      </audit-report>


      Design models/Gherkin before editing; reread evidence and preserve exact condition/result semantics and requirement IDs.
      Define a finite model: variables/production counterparts, init, transitions, outcomes, and requirement-to-property/scenario map. State domains, scopes, depth, assumptions, and abstractions; bounds must cover meaningful paths/boundaries and include reachable nontrivial positive behavior.
      Plan equivalent Quint and Alloy for every representable requirement. Quint: valid state-machine modes, explicit init/transitions, named meaningful falsifiable invariants (not truth/type/bound restatements), and bounded reachability; specify stuttering/fairness only if liveness needs it. Alloy: matching state/init/transitions, temporal trace constraint, safety assertions, and meaningful witnesses. Annotate notation limits; never omit/weaken a representable requirement.
      Plan Gherkin for the same important requirements through real production entrypoints. Each step must call production and assert consumer-visible state/result/effect; identify its call path/assertion. Use repo isolation (e.g. temporary resources); exclude parser-only, no-op, unconditional-success, pending, or undefined steps.
      Pin compatible versions from official docs/repo conventions. Confirm Alloy CLI command-selection/expectation syntax and select all intended commands (witness expect 1; assertion/no-counterexample or UNSAT expect 0). Plan actual Quint typecheck/test, seeded bounded run with explicit seed/sample/step limits, and bounded verify of named invariants on a pinned backend. No `quint lint`.
      Return the requirement/model/Gherkin matrix, state/transitions, justified bounds/assumptions, command forms to confirm against pinned help, isolation, pins, and provider-native CI/artifacts. Every property must be meaningful and traceable to evidence. Do not edit.
  implement:
    prompt: |-
      Original request: {input}

      <audit-report>
      {file:formal-specs/audit.md}
      </audit-report>

      <model-design>
      {file:formal-specs/model.md}
      </model-design>

      Implement the audited/modelled change; preserve conventions/user changes and reread reports/production paths. Limit scope to executable Quint/Alloy, real Gherkin definitions, pinned tooling/locks, provider-native CI, and verification-proven production fixes. No formal runtime feature, CLI/extra workflow flag, after-PR action, or unrelated work.
      Add source in established locations; annotate properties with requirement IDs/semantic comments. Models must match state/init/transitions/property meaning and document bounds/assumptions. Quint: valid syntax, named meaningful invariants, reachable behavior. Alloy: trace constraint, assertion checks, SAT witness, and explicit `expect` on every command (1 witness; 0 assertion/no-counterexample or intentional UNSAT). Explicitly select all commands; use `--command '*'` only if pinned help confirms it. Assertion-only runs are insufficient.
      Add Gherkin for the same IDs, integrated with the actual runner. Steps execute production and substantively assert returned state/output/persistence/effects; no copied logic, behavior-mocking, undefined/pending steps, or parser/dry-run verification. Strict mode must fail CI on undefined/pending steps; use deterministic repo isolation.
      Pin compatible Quint, Alloy CLI/JAR (checksum for downloads), JDK, Gherkin runner, and needed dependencies. Follow repo tool/lock conventions; put versions/checksums in executable setup, not a narrative doc, and use verified syntax. Update the actual provider workflow for normal PR/push to reproducibly install tools and run all formal/Gherkin plus normal relevant production build/test checks. Fail on errors; retain Quint traces, Alloy results/logs, and Gherkin reports/logs on failure. Upload only relevant reports, never secrets, per provider conventions. No credentials or manual/scheduled-only checks.
      Never weaken, delete, skip, or shrink a failing requirement/check for green. Do not edit production speculatively; use verification to distinguish contract defects from model/mapping errors.
  verify-and-fix:
    prompt: |-
      Original request: {input}

      <audit-report>
      {file:formal-specs/audit.md}
      </audit-report>

      <model-design>
      {file:formal-specs/model.md}
      </model-design>

      Verify formal specs against actual contracts and production behavior. Do not finish until every reachable local check ran, failures were diagnosed, contract-confirmed defects fixed, and the complete affected check set rerun successfully. Preserve unrelated changes; claim only observed commands/results/artifacts.
      Inspect changed files, locks, workflow, and pinned versions. Confirm actual syntax from pinned Quint/Alloy help or official docs. Run Quint `typecheck`, `test`, seeded bounded `run` with `--seed`, `--max-samples`, `--max-steps`, and bounded `verify` for every named invariant with explicit `--max-steps` and supported model-checking backend; follow that version's option order. Never substitute simulation for verification or run nonexistent `quint lint`.
      Run Alloy with explicit selection of every intended command (confirm `--command '*'` in that version); verify the receipt lists all commands and each matches `expect` (witness SAT=1; assertion/no-counterexample or UNSAT=0). Default-only runs, unchecked expectations, or omitted commands fail. Run Gherkin through the strict production test runner; confirm all steps are defined, non-pending, production-connected, and assertions execute. Run relevant existing production build/typecheck/tests and CI validation with repo tooling. PR/push CI must fail on any check and retain reports/counterexample logs on failure. Run local equivalents; do not claim remote CI ran unless observed.
      Diagnose failures against concrete traces, code paths, and audited evidence. Fix contract violations in production with a production-connected regression; correct inaccurate models only to match requirements/source semantics. Justify bound/assumption changes; never hide counterexamples by weakening invariants, removing assertions/witnesses, disabling strict mode, shrinking meaningful bounds, or skipping checks. After any source/model/runner/dependency/CI change, rerun and inspect the entire affected check set until green. If an external prerequisite blocks a check, finish reachable checks and state exactly what/why; do not claim full verification.
      Finish with concise evidence: changed spec/test/CI files, covered IDs and production paths, bounds/assumptions, exact commands and observed results, defects fixed, CI artifact behavior, and exact blockers. Report no check passed unless run.
after-pr:
  follow-up:
    workflow_call: ./_shared/after-pr.yaml
    flag: [after_pr, merge]
    with:
      resolve_conflict_prompt: |-
          Request: {input}
          Plan: {plan}. Use only if non-empty, approved, and relevant; otherwise use the request.
          Scope: formal audit/model reports and current task changes:
          {file:formal-specs/audit.md}
          {file:formal-specs/model.md}
          Resolve PR/MR #{pr.number} ({pr.url}) conflicts with the base only within this audited scope; preserve unrelated work, then stage and commit. Do not push (the next step does), weaken any requirement, assertion, bound, Gherkin check, scanner, or CI gate, or create/merge a PR.
      fix_ci_error_scope: |-
          Use the formal audit/model reports and current PR changes:
          {file:formal-specs/audit.md}
          {file:formal-specs/model.md}
  squash-merge:
    flag: merge
    squash-merge: true
    timeout: 10m
    if:
      fail: follow-up/sync-base

