description: Audit repository quality gates, complete meaningful tests and CI, then verify and repair failures
force_exec: true
flags:
  after_pr:
    description: Run pull-request or merge-request readiness, synchronization, and CI follow-up
  merge:
    description: Run after-PR follow-up and perform a host-managed squash merge

steps:
  read-and-plan:
    prompt: |-
      Audit this repository's test and quality-gate coverage before changing files. Treat {input} as the original request and an optional scope constraint: if it is empty, work across the repository; if it names a narrower change, keep code/test edits within that scope while still checking shared manifests, toolchains, scripts, and CI wiring that the scope depends on. Never ask the user to resolve discoverable details.

      Approved plan reference: {plan}. Read the referenced plan only when it exists, is non-empty, approved, and relevant to this request; use its scope, constraints, and acceptance criteria to refine the original request. If no non-empty approved plan is available, including in exec mode, use the original request as the task scope and requirements; do not infer approval or claim that a plan was approved.

      ## Read the real stack

      Inspect the repository's manifests, lockfiles, toolchain pins, test helpers and suites, CI workflows, scripts, and entry points. Trace how a consumer reaches the behavior under test. Record concrete commands and versions from the repository; do not assume a familiar framework or introduce one before checking what is already there.

      Identify every language, runtime, deployable component, and package from the actual repository manifests and lockfiles; do not assume any stack or component from this workflow's name or its host repository. Inspect each discovered component's source entry points, test helpers/suites, scripts, toolchain configuration, and native CI workflows. Record actual conventions and commands, then trace how consumers reach changed behavior. Preserve the repository's existing valid coverage rather than replacing it with an imagined stack.

      Check the actual CI provider and its job graph, triggers, permissions, credentials, platform matrix, pinned tools, lockfile behavior, and failure propagation. Identify deployment/release jobs separately from safe test jobs and determine whether secret-free validation runs on pull requests, including external contributions where supported.

      ## Behavior and coverage audit

      Build a bounded, evidence-backed inventory of in-scope, consumer-visible production behaviors and real user journeys supported by the repository, the original request, and relevant approved-plan requirements. Trace each behavior from its actual production boundary (public API, CLI/API event, state transition, validation/error path, or other real entry point) to the owning component, source path and symbol. For each journey, identify the real entry point and applicable negative, permission, boundary, and recovery variants; include only variants the product actually supports and that matter to the scoped behavior.

      Give each behavior/journey a stable `COV-###` ID and record its owning component, source path/symbol, production boundary or entry point, relevant variant, and evidence. Link existing tests by path and test symbol, with the specific assertion that proves the behavior; classify each row `Covered`, `Partial`, or `Missing` with a concrete rationale. For partial or missing coverage, state a priority and the smallest actionable test/assertion or test-infrastructure change. Assign stable `GAP-###` IDs to actionable test, formatter/linter/type-check, reproducibility, or CI gaps in the coverage matrix, linking them to relevant `COV` IDs where applicable. Preserve IDs through apply and verification; do not renumber them or treat an implementation disposition as proof of coverage.

      Inventory only behavior supported by the requested scope and repository evidence; do not claim exhaustive enumeration, impose numeric coverage quotas, or create tests for incidental wording, defaults, or implementation details. Record exclusions and unreviewed areas with reasons and limits. Distinguish a genuinely inapplicable layer from an applicable but currently absent check, and a meaningful behavior gap from duplicate or incidental test coverage.

      For each applicable package/component, retain the formatter, linter/static or type-check, unit, integration, and end-to-end coverage matrix. Record the current command, version/lockfile source, CI trigger/job, meaningful coverage, and evidence-backed gap, using the stable IDs above. For every applicable in-scope UI flow, record real-app visual evidence and reusable assertion-bearing E2E coverage separately; screenshots alone do not close an E2E gap. Record the suitable existing runner or why none fits, plus official compatibility evidence for any recommended fallback. Inspect success, error, validation, and realistic boundary behavior where supported; identify exact source symbols and consumer-visible assertions needed.

      An E2E test must cross a real product boundary: for example, invoke the actual CLI executable, send a request through the actual HTTP/API entry point, or exercise the actual browser journey when browser interaction is the changed behavior. Select only boundaries present in the discovered product. Reuse existing end-to-end runners; use real browser automation only for a changed browser journey when a reproducible real-browser path is justified. If no mobile or native desktop application exists, do not invent one, fake a GUI, or require a browser merely to relabel component tests as E2E. Never use live external credentials or network services in tests.
      Before selecting, preparing, or using testing tools, follow repository instructions. For every in-scope real product target, first reuse appropriate tooling already established in this repository (manifests, tests, scripts, CI, and instructions), preserving its versions, commands, setup, and CI. Evaluate visual interaction/screenshot capability and saved assertion-bearing E2E tooling separately; these existing tools take priority over defaults. Apply target-specific recommendations below only to capabilities that lack suitable existing tooling. Classify the product/framework from manifests and source before platform-specific choices; generated iOS files alone do not make React Native/Expo a SwiftUI app. Inspect/load relevant available installed skills through the executing agent's provided mechanism and use connected/available MCP servers when appropriate; skills are optional, do not install them, and their absence alone is not a blocker. Do not guess skill/tool APIs, add global MCP/config entries, or force computer-use settings. Skills and MCP never override user or repository requirements.
      - Browser UI: use Playwright CLI (`playwright-cli`) for visual interaction and Playwright Test (`*.spec.ts`, `npx playwright test`) for saved E2E.
      - SwiftUI iOS/macOS: when suitable existing visual tooling is absent, use Xcode MCP for actual app interaction and screenshot capture after confirming those capabilities; SwiftUI Preview alone is insufficient. When suitable existing saved UI E2E tooling is absent, use XCTest with XCUIAutomation (`xcodebuild test`). App Intents Testing is additional only when testing actual intent integration, never a UI E2E replacement.
      - Android native: use mobile-mcp for visual interaction. Use Espresso for Views, Compose UI Test for Compose, and UI Automator for system UI or cross-app flows.
      - React Native/Expo iOS and Android: use agent-device CLI or a connected MCP for visual interaction; use Detox + Jest (`detox build` / `detox test` configurations) for saved E2E. Expo requires a native build integrated with Detox, not Expo Go. Pin and verify Expo SDK, embedded React Native, New Architecture, and Detox compatibility; retain prebuild/config-plugin generated native workflows and do not rely on manual-only generated-file edits. Cover native iOS Simulator and a supported Android runtime as appropriate, not blanket physical iOS devices. Unsupported Detox setup/compatibility is a blocker, not a reason to switch runners.
      - Electron: use Playwright Electron API to interact with and capture screenshots from the real Electron app, and Playwright Test with that API for saved E2E. Verify its experimental API/version compatibility; renderer-in-browser tests are not native Electron passes, and OS-native-dialog stubs do not prove real OS-dialog coverage.
      - Disposable external dependencies: when the real in-scope product needs an external database/service (not an embedded or in-process DB, and not a no-DB target) and suitable provisioning is absent, recommend Testcontainers with the stack-supported library and pinned compatible library/image versions. Wait for readiness, use dynamically mapped connection details, run real application migrations and isolated seed data, and clean up only test-owned resources. A missing required Docker-compatible runtime is explicitly blocked, never replaced by a host/production DB, mocks, or a claimed pass. References: https://testcontainers.com/ and https://rust.testcontainers.org/.
      - CLI/TUI: when saved process tests are absent, recommend bats-core for tests invoking the actual built CLI executable and asserting meaningful exit status, stdout/stderr, and side effects. Bats `run` succeeds after capturing the command, so explicitly assert the captured target status. For an actual interactive TUI, use Bats to orchestrate a real PTY-capable interaction harness (reuse an existing one, e.g. Expect where appropriate), send keys, assert terminal screen/state transitions, and inspect rendered terminal/image evidence when applicable; a pipe or `--help` smoke is not TUI E2E. Check supported Bash/host and do not force unsupported native Windows Bash. Missing suitable PTY/runtime is explicitly blocked. Reference: https://github.com/bats-core/bats-core.
      - Web HTTP APIs: when suitable saved API tests are absent, recommend Hurl `.hurl` tests run with `hurl --test` against the real local application's HTTP endpoints, with substantive response and relevant state/effect assertions, existing setup/isolation/local test auth, and no live credentials or production services. Provision needed external DB dependencies with Testcontainers when appropriate; static schema/parser checks or mocked HTTP are not endpoint E2E. Reference: https://hurl.dev/.
      - Backend service integrations: recommend Pact only for an evidenced consumer/provider HTTP or message contract with controllable, supported participants and no suitable existing contract tooling. Generate contracts through actual consumer client code, verify them against the real provider implementation with explicit provider states, and record both consumer and provider verification. Consumer mocks or pact-file generation alone are not complete verification. Pact is not general backend/DB E2E or a replacement for real-path checks; controlled protocol contract doubles are valid contract tests, not mock-only E2E. Do not require a Broker, PactFlow, cloud infrastructure, or secrets. References: https://docs.pact.io/ and https://docs.pact.io/getting_started/what_is_pact_good_for.
      - Tauri: classify only an actual native Tauri app (WebView plus Rust/IPC), not ordinary browser or Electron UI. For a missing suitable visual capability, recommend https://github.com/P3GLEG/tauri-plugin-mcp for real-app interaction/screenshots and inspect actual image pixels. For missing saved E2E, recommend https://github.com/Choochmeque/tauri-webdriver with companion https://github.com/Choochmeque/tauri-plugin-webdriver and a real WebDriver client/test runner (reuse an existing client or choose a stack-compatible one such as WebdriverIO/Selenium); a server alone is not a suite. Pin versions/Git revisions and confirm actual host, Tauri, WebView, and client compatibility. Exercise relevant real frontend-to-Rust IPC/native behavior with substantive assertions. Both plugins are dev/test only: exclude automation endpoints from production builds and use local/isolated test sessions; do not globally enable MCP. The plugin defaults to stubbing JS alert/confirm/prompt; those stubs and synthetic/untrusted events do not prove real native-dialog coverage. Missing required host/runtime/plugin/capability is explicitly blocked, never a browser-only substitute. The listed Tauri recommendation is permitted only for actual supported Tauri targets and does not force a platform matrix.
      Native targets/capabilities without an applicable listed framework recommendation are not excluded or platform allowlists: reuse appropriate existing tooling when present. When only one of visual interaction/screenshot or saved E2E capability is available, do reachable work with that capability and report the missing capability as incomplete; do not claim both. Do not recommend or introduce new Maestro, Appium WinCore, or dogtail/AT-SPI defaults; reuse them only if already established and appropriate. Browser/Electron checks on supported hosts and CI remain in scope, and Linux web CI must not be disabled. Do not generalize unsupported Apple OS targets. Verify official compatibility documentation and pin versions before introducing an allowed tool. If established required tooling exists but its compatible host, runtime, or server is unavailable, report the precise blocker; never mark it passed or relabel it excluded due to platform.
      For each applicable selected UI flow, use established suitable tooling first and applicable recommendations only for genuinely absent capabilities to do both: (1) launch and interact with the real app, capture/save screenshots of meaningful states and failures, and inspect the screenshot pixels themselves (not only an accessibility/DOM tree or Preview); and (2) keep deterministic, assertion-bearing E2E source in the repository with isolated/reset state and repeatable build/run commands, then execute it independently of prior exploration sessions and LLM decisions. If a capability is unavailable under the no-new-tool policy above, do reachable work with the available capability and report the missing capability as incomplete; never imply both were completed. One actual E2E run with its inspected screenshots can satisfy both when both capabilities are available; no duplicate run or pixel-diff/golden test is required. Classify visual evidence separately from reusable E2E closure; a screenshot-only result is not `Covered` when E2E applies.


      ## CI/security audit

      Identify the existing CI provider and retain it. Plan secret-free pull-request checks, including external contributions where the provider permits them; use explicit least-privilege permissions, avoid privileged triggers for untrusted code, and do not attach write-capable credentials or secrets to jobs that execute untrusted changes. Keep deploy/release jobs gated away from untrusted PR execution. Commands must fail on genuine failures: no ignored exit codes, weakened assertions, or `continue-on-error` disguising red checks.

      Reproducibility is required. Respect each component's declared minimum supported versions and committed lockfiles. Use exact tool/runtime versions and locked/frozen installs where the ecosystem supports them; if a tool is floating or missing a pin, plan the smallest compatible pin and align local guidance and CI. Do not add a second test framework when the existing stack can cover the behavior. Pin new external CI actions/plugins to verified immutable versions, and never add a secret-dependent test path.

      ## Required artifact

      Save a compact but complete, evidence-backed implementation plan in this session artifact. It must include:
      - The approved task scope, constraints, and acceptance criteria, preserving relevant refinements from a non-empty approved plan. If no non-empty approved plan is available, including in exec mode, state that and derive scope and criteria from the original request; do not infer approval.
      - Repository/component inventory and current commands/versions.
      - A coverage matrix with applicable versus inapplicable layers and evidence for each gap.
      - The exact tests to add or complete, including important error/boundary assertions and real E2E entry points.
      - The exact formatter/linter/typecheck/test commands and CI jobs/triggers/permissions to add or repair.
      - The reproducibility/version/lockfile changes required and any genuine prerequisite that cannot be reached without secrets or unavailable hardware.

      Do not change workspace files or run checks in this read-only phase. Do not call an applicable layer inapplicable merely because it is absent today.
    output_file: test-ci-gap-plan.md
    timeout: 30m
  apply-tests-and-ci:
    prompt: |-
      Original request: {input}

      Implement the complete test and CI work from this evidence-backed plan:

      {file:test-ci-gap-plan.md}

      ## Contract authority

      1. The user's request and acceptance criteria.
      2. Repository-owned requirements and documented consumer behavior.
      3. Existing tests, after checking they represent those higher-authority contracts.
      4. Current implementation details.

      A failing test is evidence, not automatic authority. Never delete, skip, weaken, or rewrite a valid test to make the suite green. Correct a test only when an explicit higher-authority requirement proves it wrong, and cite that evidence.

      ## Implementation

      1. Recheck the plan's file and line evidence against the current workspace. Preserve unrelated user changes; never reset, stash, or revert them.
      2. Add or complete only missing applicable formatter/linter/static or type gates and meaningful unit, integration, and E2E tests. Cover consumer-observable success, errors, validation, and realistic boundaries. For every applicable selected UI flow, implement both the real-app screenshot/pixel-inspection protocol and deterministic assertion-bearing saved E2E source specified in the plan, using suitable existing tooling first and applicable recommendations only for absent capabilities. If the no-new-tool policy leaves a capability unavailable, complete reachable work and report that capability as missing/incomplete; never claim both screenshot and E2E evidence. Isolate/reset state and record repeatable build/run commands. No source-text assertions, mocks-only E2E, live secrets/network, or fake GUI.
      3. Before selecting, preparing, or using testing tools, inspect/load available relevant installed skills using this agent's provided mechanism when available; skills are optional and must not be installed. Follow repository instructions and preserve established appropriate tooling, versions, commands, setup, and CI. Use the plan's evidence-backed target-specific recommendation only for a capability without suitable existing tooling and only where policy allows new tooling; use connected/available MCP servers as appropriate, without guessed APIs or global MCP/config changes. Run only supported real product boundaries. An established required tool/server/runtime that is unavailable is an exact blocker, never a pass; when the native no-new-tool policy applies, perform reachable work and report the absent capability as incomplete. Do not simulate unsupported runtimes or silently switch runners.
      For any selected target-specific recommendation, implement only the absent, in-scope capability after confirming supported host/runtime and compatibility; do not install irrelevant tools or replace established tooling. Exercise and record exact repeatable commands/results at the real boundary: Testcontainers uses the stack-supported library, pinned images, readiness, dynamic mappings, real migrations, isolated data, and test-owned cleanup; Bats invokes the built CLI and explicitly asserts captured status, while TUI checks use a real PTY and assert interactions/state (not pipe-only output); Hurl runs `hurl --test` against real local app endpoints and asserts response plus relevant effects; Pact records actual consumer generation and real-provider verification with provider states on both sides; Tauri uses separate missing-capability visual and WebDriver recommendations as applicable, exercises real app/IPC behavior, and keeps plugins out of production. Report unavailable required runtime/tooling as blocked, not passed; never use live credentials/external production services or classify protocol contract doubles as completed E2E.
      4. Configure the repository's existing CI provider to run all applicable checks on pull requests without secrets, including external contributions where supported. Keep deploy/release jobs separate and secret-gated. Set least-privilege permissions explicitly; do not run untrusted changes under privileged triggers. Make every relevant command's nonzero exit fail the job. Preserve existing verified platform-matrix and integration-script checks.
      5. Pin exact compatible tool versions, honor declared minimum supported versions, use committed lockfiles and locked/frozen dependency installs where supported, and make installs reproducible. Pin formatting/lint tools and CI actions/plugins too. Do not claim reproducibility from a floating `stable`, `latest`, or semver range alone. Do not silently raise a supported minimum or replace existing tooling.
      6. Implement the plan now; do not return a backlog, a scaffold, or a list of proposed tests. If evidence shows an enumerated gap is already fully covered, leave it unchanged and cite the specific existing test and CI job. If an applicable layer has a genuine unreachable prerequisite, complete all reachable work and state the exact blocker rather than substituting a mock or omitting it.

      Do not run verification checks in this phase; the next phase owns the complete check-and-repair pass.

      ## Required implementation report

      Save a concise, evidence-backed implementation report in the session artifact `test-ci-implementation.md`. For every `COV` and `GAP` ID in the plan, and every additional ID addressed during implementation, record exactly one disposition: `applied`, `already-covered`, `rejected`, or `blocked`. Give the source/test/CI paths and symbols, specific assertions and relevant command or CI job evidence that support the disposition. For `applied`, identify changed test/CI files and the consumer-visible assertion or gate added/repaired; for `already-covered`, cite the existing adequate evidence; for `rejected`, cite the higher-authority reason; for `blocked`, name the exact unavailable prerequisite and reachable work completed. Do not treat rejection or blockage as successful coverage.

      ### Implemented coverage
      - Each applicable layer and the tests or existing coverage that satisfy it, linked to stable IDs and evidence.

      ### CI and reproducibility
      - Provider workflows/jobs/triggers/permissions changed and exact pinned tools/lockfile behavior, linked to relevant IDs and evidence.

      ### Changed files
      - File and purpose for every change.

      ### Remaining blockers
      - Exact missing prerequisite and reachable work completed, or `none`.
    output_file: test-ci-implementation.md
    timeout: 1h
  verify-and-repair:
    prompt: |-
      Original request: {input}

      Independently verify the applied test and CI work against the original request, the plan, the implementation report, and acceptance criteria; repair real defects until all reachable checks pass.

      Plan:
      {file:test-ci-gap-plan.md}

      Implementation report:
      {file:test-ci-implementation.md}

      ## Contract authority

      1. The user's request and acceptance criteria.
      2. Repository-owned requirements and documented consumer behavior.
      3. Existing tests, after checking they represent those higher-authority contracts.
      4. Current implementation details.

      A failing test is evidence, not automatic authority. Never delete, skip, weaken, or rewrite a valid test to make the suite green. Correct a test only when an explicit higher-authority requirement proves it wrong, and cite that evidence.

      ## Required verification

      1. Re-read the plan, implementation report, changed manifests/configuration/workflows, and current source and test code. Independently recheck every planned `COV` and `GAP` ID and every additional ID in the implementation report against the real scoped behavior, source boundary, test path/symbol, specific assertion, and relevant CI job/command. Do not trust reported dispositions: confirm each `already-covered` row is adequate, each `applied` change exists and proves the behavior, and each `rejected` or `blocked` row has a valid authority-based reason or exact prerequisite. Do not omit unresolved IDs.
      2. Before using testing tools, inspect/load available relevant installed skills using this agent's provided mechanism when available; skills are optional and must not be installed. Run the exact formatter, linter/static/type checks, unit, integration, and E2E checks recorded in the plan, including existing checks affected by changes, with committed lockfiles and pinned versions. Run saved UI E2E independently of prior exploration sessions and LLM decisions using its repeatable build/run command and isolated/reset state when suitable tooling exists. For each applicable selected UI flow, also launch/interact with the real app, save screenshots of meaningful states and failures, and inspect the actual image pixels when suitable visual tooling exists; accessibility/DOM inspection or SwiftUI Preview alone is insufficient. If the no-new-tool policy leaves either capability unavailable, report it as incomplete and do not imply it was performed; if established tooling requires an unavailable host/runtime/server, report the exact blocker. One E2E run with inspected screenshots suffices when both capabilities are available; do not require a duplicate run or pixel-diff/golden test. Execute only supported real product boundaries. Do not report a command as passed unless it exited successfully; include exact command and result.
      Independently execute every selected target-specific test command recorded in the plan: native stack-supported Testcontainers tests against the pinned disposable services with readiness, dynamic mappings, migrations, isolation, and test-owned cleanup; Bats tests against the built CLI with an explicit captured-status assertion and real PTY/state assertions for any TUI; `hurl --test` against real local HTTP endpoints with response/effect assertions; both actual Pact consumer-contract generation and provider verification against the real provider with provider states; and Tauri saved WebDriver tests through real frontend-to-Rust behavior. For Tauri, separately capture/interact with the real app when visual capability is selected and inspect screenshot pixels; confirm plugins are test-only/excluded from production, and do not count stubbed dialogs as native-dialog evidence. Preserve existing tools and install no unnecessary tooling; report exact command/results or the precise unavailable runtime/capability as blocked, never as a pass.
      3. Run the exact component-specific checks recorded in the plan, using each ecosystem's existing reproducible install, type-generation, configuration, and test commands. Use only documented dummy configuration when a local check requires it; never overwrite or expose a developer's existing ignored secrets file, and remove any temporary file created by this verification.
      4. If any check exposes a real defect, diagnose it against the authority order above, fix the source or test infrastructure without weakening valid assertions, then rerun the failed check and the complete affected verification set. Continue until green or until a precise external prerequisite blocks completion. Do not treat missing prerequisites as success, silently skip a layer, or substitute mocks/no-ops.
      5. Inspect the final change set for unrelated edits, generated artifacts, leaked credentials, lockfile drift, skipped tests, or CI steps that can mask failures. Preserve all pre-existing user work.

      ## Required verification artifact

      Save a concise evidence report as the existing session artifact `test-ci-verification.md`. Include every required layer and exact command/status, actual end-to-end surface exercised, test/CI fixes made after failures, final result, and any exact blocked prerequisite with the reachable checks already completed. For each stable `COV` and `GAP` ID, record the independently verified disposition and refreshed `Covered`, `Partial`, or `Missing` status where applicable, evidence and rationale, including any remaining gap; cite the relevant executed check command and result, or state that it was not run and why. Reconcile all plan IDs and implementation-report IDs, and update the coverage inventory, exclusions, unreviewed areas, and limits based on what was actually verified. Clearly mark anything not run; do not claim unexercised verification.



      ## Final output

      ### Results
      - Formatter/linter/typecheck
      - Unit/integration/E2E
      - CI safety and reproducibility

      ### Repairs
      - Real defects fixed and checks rerun, or `none` with evidence

      ### Blockers
      - Exact blocker and completed reachable work, or `none`

      ### Artifacts
      - Gap plan, implementation report, and verification report.
    output_file: test-ci-verification.md
    timeout: 1h
after-pr:
  follow-up:
    workflow_call: ./_shared/after-pr.yaml
    flag: [after_pr, merge]
    with:
      resolve_conflict_prompt: |-
          Original request: {input}

          Approved plan: {plan}. Read it only when non-empty and relevant; otherwise use the original request.

          Task/report scope: use the test gap plan, implementation report, and current task changes:
          {file:test-ci-gap-plan.md}
          {file:test-ci-implementation.md}

          A conflict occurred while synchronizing PR/MR #{pr.number} ({pr.url}) with its base branch. Resolve only this conflict within the approved test/CI scope, preserve unrelated work, then stage and commit the resolution. Do not push; the following step handles it. Never weaken or disable tests, scanners, assertions, or CI policy to get green. Do not create or merge a PR directly.
      fix_ci_error_prompt: |-
          Original request: {input}

          Approved plan: {plan}. Read it only when non-empty and relevant; otherwise use the original request.

          Task/report scope: use the test gap plan, implementation report, verification report, and current PR changes:
          {file:test-ci-gap-plan.md}
          {file:test-ci-implementation.md}
          {file:test-ci-verification.md}

          CI for PR/MR #{pr.number} ({pr.url}) failed. For GitLab, inspect `$(git rev-parse --git-dir)/cruise-ci-traces.log`; for GitHub, inspect `gh pr checks {pr.number}` and the failed run logs. Fix only a genuine failure within the approved test/CI scope, then stage, commit, and push the PR branch. Never weaken, remove, skip, or disable tests, scanners, assertions, required checks, or policy to make CI green. The agent must not create or merge a PR; the host-managed native step owns any explicitly opted-in squash merge.
  squash-merge:
    flag: merge
    squash-merge: true
    timeout: 10m

