description: Audit repository quality gates, complete meaningful tests and CI, then verify and repair failures
force_exec: true
flags:
  after_pr:
    description: Run pull-request or merge-request readiness, synchronization, and CI follow-up
  merge:
    description: Run after-PR follow-up and perform a host-managed squash merge

steps:
  read-and-plan:
    prompt: |-
      Audit repository test/quality-gate coverage before editing. {input} is the request and optional scope: empty means repository-wide; otherwise keep code/test edits in scope but inspect dependent shared manifests, toolchains, scripts, and CI. Never ask the user to resolve discoverable details.

      Approved plan: {plan}. Read only if existing, non-empty, approved, and relevant; refine {input} with its scope, constraints, and acceptance criteria. Otherwise, including exec mode, use {input}; never infer approval.

      ## Repository and CI

      Inspect manifests/lockfiles, pinned toolchains, source/entry points, suites/helpers, scripts, and native CI. Derive languages, runtimes, deployables, and packages from repo evidence, not workflow name/host. For each, record consumer paths, conventions, commands/versions; preserve valid coverage and don't assume a stack or framework.
      Inspect CI provider/job graph, triggers, permissions, credentials, platform matrix, pins, lockfile behavior, and failure propagation. Separate deploy/release from safe tests; check secret-free PR checks, including external contributions where supported.

      ## Behavior and coverage

      Inventory bounded, evidence-backed in-scope consumer-visible behaviors/journeys supported by repo, request, and relevant approved plan. Trace each real production boundary/entry point to component, source path, and symbol; include only supported/relevant negative, permission, boundary, and recovery variants. No exhaustive claims, quotas, or tests for incidental wording/defaults/implementation details. Record exclusions/unreviewed areas with reasons/limits; distinguish inapplicable layers from missing checks and meaningful gaps from duplicate/incidental coverage.

      Assign stable `COV-###` IDs; record component, path/symbol, boundary, variant, evidence, test path/symbol and proving assertion, `Covered`/`Partial`/`Missing` status and rationale. For partial/missing rows, give priority and smallest actionable test/assertion/infrastructure change. Assign stable `GAP-###` IDs to actionable test, formatter/linter/type-check, reproducibility, or CI gaps; link COVs. Preserve IDs through apply/verify; never renumber or treat disposition as coverage proof.

      Per applicable component, matrix formatter, linter/static or type-check, unit, integration, and E2E with current command, version/lockfile source, CI trigger/job, meaningful coverage, and evidence-backed gaps. For applicable UI flows, separate real-app visual evidence from reusable assertion-bearing UI E2E; screenshots alone aren't E2E coverage. Record suitable existing runner or why none fits, and official compatibility evidence for fallbacks. Keep UI E2E separate from default CLI/API/service/contract tests. Identify supported success/error/validation/realistic-boundary behavior, source symbols, and consumer-visible assertions.

      E2E crosses an actual product boundary (built CLI, real HTTP/API entry point, or changed browser journey); use only discovered boundaries. Reuse existing runners; use real browser automation only for changed browser journeys with a justified reproducible path. Don't invent mobile/native apps, fake GUIs, or require a browser to relabel component tests. Never use live credentials or external network services.

      Follow repo instructions and preserve established tools, versions, commands, setup, and CI. Identify UI targets from manifests/entry points; run `cruise docs e2e`, then `cruise docs e2e <framework>` for each matching policy ID of an actual target. These are canonical UI policies; don't duplicate framework advice here. For non-UI, prefer existing tools and use only relevant recommendations below when capability is absent. Skills/MCP are optional; don't install skills, guess APIs, or change global MCP/config.

      ## Non-UI recommendations

      - External DB/service: if required by the real in-scope product (not embedded/in-process or no-DB) and provisioning is absent, recommend Testcontainers with stack-supported library and pinned compatible library/image versions. Wait for readiness; use dynamic mappings, real migrations, isolated seed data, test-owned cleanup. Missing Docker-compatible runtime is blocked; never substitute host/production DB, mocks, or a pass. References: https://testcontainers.com/ and https://rust.testcontainers.org/.
      - CLI/TUI: if saved process tests are absent, recommend bats-core on the built CLI, asserting meaningful exit status, stdout/stderr, and side effects; explicitly assert target status because Bats `run` succeeds after capture. For actual TUI, use Bats with a real PTY harness (reuse one, e.g. Expect), send keys, assert screen/state transitions, inspect rendered terminal/image evidence when applicable. Pipe/`--help` isn't TUI E2E. Check Bash/host support; don't force unsupported native Windows Bash. Missing PTY/runtime is blocked. Reference: https://github.com/bats-core/bats-core.
      - Web HTTP API: if suitable saved API tests are absent, recommend Hurl `.hurl` via `hurl --test` against real local endpoints; assert substantive responses/effects using existing setup/isolation/local test auth, never live credentials or production services. Use Testcontainers for needed external DBs where appropriate; static schema/parser checks and mocked HTTP aren't endpoint E2E. Reference: https://hurl.dev/.
      - Backend contracts: recommend Pact only for evidenced consumer/provider HTTP or message contracts with controllable supported participants and no suitable tooling. Generate via actual consumer client code; verify real provider with explicit states and record both sides. Consumer mocks/pact-file generation alone are incomplete. Pact isn't general backend/DB E2E or a real-path replacement; controlled protocol doubles are valid contract tests, not mock-only E2E. No Broker, PactFlow, cloud infrastructure, or secrets. References: https://docs.pact.io/ and https://docs.pact.io/getting_started/what_is_pact_good_for.

      ## CI and reproducibility

      Retain existing CI provider. Plan secret-free PR checks (including external contributions where supported), explicit least-privilege permissions, no privileged triggers or write credentials/secrets for untrusted code, and deploy/release jobs gated from untrusted PRs. Genuine failures fail commands: no ignored exits, weakened assertions, or `continue-on-error`.
      Respect supported minimum versions and committed lockfiles. Use exact tool/runtime versions and locked/frozen installs where supported; plan smallest compatible pins for floating/unpinned tools and align local guidance/CI. Don't add another framework if existing tools suffice. Pin new CI actions/plugins to verified immutable versions; no secret-dependent test path.

      ## Required artifact

      Save a compact, complete, evidence-backed plan in this session artifact:
      - Scope, constraints, and acceptance criteria from relevant approved plan; otherwise state no non-empty approved plan was available (including exec mode) and derive from {input}, without inferring approval.
      - Repo/component inventory and current commands/versions.
      - Coverage matrix, applicability, and evidence for each gap.
      - Exact tests to add/complete, including error/boundary assertions and real E2E entry points.
      - Exact formatter/linter/typecheck/test commands and CI jobs/triggers/permissions to add/repair.
      - Reproducibility/version/lockfile changes and genuine prerequisites unavailable without secrets/hardware.

      Read-only: don't change workspace files or run checks. An applicable layer isn't inapplicable merely because its check is absent.
    output_file: test-ci-gap-plan.md
    timeout: 30m
  apply-tests-and-ci:
    prompt: |-
      Original request: {input}

      Implement the complete test/CI work in this evidence-backed plan:
      {file:test-ci-gap-plan.md}

      ## Contract authority

      User request/criteria > repository requirements/documented behavior > existing tests (only after validating against higher authority) > current implementation.

      A failing test is evidence, not authority alone. Never delete, skip, weaken, or rewrite a valid test to pass. Correct one only when explicit higher authority proves it wrong; cite that evidence.

      ## Implementation

      1. Recheck plan file/line evidence in the current workspace; preserve unrelated user work (never reset, stash, or revert).
      2. Add/complete only missing applicable gates and meaningful unit/integration/E2E for consumer-visible success, errors, validation, and realistic boundaries. For planned UI targets, run `cruise docs e2e` then matching `cruise docs e2e <framework>` policies for actual frameworks; follow canonical policies/plan, don't change runners. Keep UI E2E separate from default CLI/API/service/contract tests. Implement missing in-scope capabilities; complete reachable work and report unavailable work incomplete, never complete. Isolate/reset state and record repeatable build/run commands. No source-text assertions, mocks-only E2E, live secrets/network, or fake GUIs.
      3. Before choosing/preparing/using tools, inspect/load relevant installed skills via available mechanism; optional, never install. Follow repo instructions and preserve established tools, versions, commands, setup, and CI. Use plan recommendations only for absent capabilities without suitable tools and where policy permits; use available MCP without guessed APIs or global MCP/config changes. Use supported real boundaries only. Unavailable required tool/server/runtime is an exact blocker, not a pass; under native no-new-tool policy, do reachable work and report missing capability incomplete. Never simulate unsupported runtimes or silently switch runners.

      For each selected non-UI recommendation, confirm host/runtime support and compatibility; implement only the absent in-scope capability, without irrelevant installs or replacing tools. Exercise and record exact repeatable real-boundary commands/results:
      - Testcontainers: stack-supported library, pinned images, readiness, dynamic mappings, real migrations, isolated data, test-owned cleanup.
      - Bats: built CLI with explicit captured-status assertion; TUI uses real PTY and asserts interaction/state, not pipe-only output.
      - Hurl: `hurl --test` against real local app endpoints; assert responses and relevant effects.
      - Pact: actual consumer generation and real-provider verification with provider states on both sides.
      Unavailable required runtime/tooling is blocked, not passed. Never use live credentials/production services or count protocol contract doubles as completed E2E.
      4. Configure existing CI for every applicable secret-free PR check, including external contributions where supported. Separate/secret-gate deploy/release; set explicit least-privilege permissions; don't run untrusted changes under privileged triggers. Relevant nonzero commands fail jobs. Preserve verified platform matrices and integration-script checks.
      5. Pin exact compatible versions; honor minimums; use committed lockfiles and locked/frozen installs where supported. Make installs reproducible; pin format/lint tools and CI actions/plugins. `stable`, `latest`, or semver ranges alone aren't reproducible. Don't silently raise supported minimums or replace tools.
      6. Implement now, not backlog/scaffold/proposal. If a planned gap is already covered, leave it and cite the exact test and CI job. For an applicable unreachable prerequisite, do reachable work and state the exact blocker; don't substitute mocks or omit it.

      Do not run verification checks; the next phase owns them.

      ## Required implementation report

      Save concise evidence in `test-ci-implementation.md`. For every plan `COV`/`GAP` and additional addressed ID, record exactly one: `applied`, `already-covered`, `rejected`, or `blocked`. Cite source/test/CI paths and symbols, proving assertions, relevant commands/jobs. For `applied`, name changed files and assertion/gate; for `already-covered`, adequate evidence; for `rejected`, higher authority; for `blocked`, exact prerequisite and reachable work. Rejection/blockage isn't successful coverage.

      ### Implemented coverage
      - Applicable layers and satisfying tests/existing coverage, linked to IDs/evidence.

      ### CI and reproducibility
      - Changed workflows/jobs/triggers/permissions and exact pins/lockfile behavior, linked to IDs/evidence.

      ### Changed files
      - Every file and purpose.

      ### Remaining blockers
      - Exact missing prerequisite and reachable work, or `none`.
    output_file: test-ci-implementation.md
    timeout: 1h
  verify-and-repair:
    prompt: |-
      Original request: {input}

      Independently verify test/CI work against the request, plan, implementation report, and criteria; repair real defects until all reachable checks pass.

      Plan:
      {file:test-ci-gap-plan.md}

      Implementation report:
      {file:test-ci-implementation.md}

      ## Contract authority

      User request/criteria > repository requirements/documented behavior > existing tests (only after validating against higher authority) > current implementation.

      A failing test is evidence, not authority alone. Never delete, skip, weaken, or rewrite a valid test to pass. Correct one only when explicit higher authority proves it wrong; cite that evidence.

      ## Required verification

      1. Re-read plan, report, changed manifests/config/workflows, source, and tests. Independently check every plan/report `COV`/`GAP` against scoped behavior, source boundary, test path/symbol/assertion, and CI job/command. Confirm `already-covered` is adequate, `applied` exists and proves behavior, and `rejected`/`blocked` is valid; omit no unresolved IDs.
      2. Before test tools, inspect/load relevant installed skills via available mechanism; optional, never install. For each planned UI target, run `cruise docs e2e` then matching `cruise docs e2e <framework>` policy for its actual framework. Independently verify policy: run saved E2E separately from prior exploration/LLM decisions, with repeatable commands and isolated/reset state; launch/interact with actual app, save meaningful screenshots, inspect pixels when available. Keep UI E2E separate from default CLI/API/service/contract checks. No-new-tool limits/unavailable prerequisites are incomplete or blocked, never passed. Run the plan's exact formatter, linter/static/type, unit, integration, and E2E checks (including affected existing checks), with committed lockfiles and pinned versions. Use supported real boundaries; report exact commands/results and never claim pass unless the command succeeded.
      3. Independently run every selected non-UI plan command:
      - Testcontainers: stack-supported tests on pinned disposable services; readiness, dynamic mappings, migrations, isolation, test-owned cleanup.
      - Bats: built CLI with explicit captured-status assertion; real PTY/state assertions for TUI.
      - Hurl: `hurl --test` on real local HTTP endpoints with response/effect assertions.
      - Pact: actual consumer generation and real-provider verification with provider states.
      Preserve existing tools; install no unnecessary tooling. Give exact commands/results or precise unavailable runtime/capability as blocked, never passed.
      4. Run plan's exact component checks with ecosystem's reproducible install, type-generation, config, and test commands. Use only documented dummy config; never overwrite/expose ignored developer secrets; remove temporary files created.
      5. Diagnose defects by authority order; fix source/test infrastructure without weakening assertions, then rerun failed check and complete affected set. Continue to green or precise external blocker. Missing prerequisites aren't success; don't skip layers or substitute mocks/no-ops.
      6. Inspect final changes for unrelated edits, generated artifacts, leaked credentials, lockfile drift, skipped tests, or CI steps masking failures. Preserve pre-existing user work.

      ## Required verification artifact

      Save evidence in `test-ci-verification.md`: every required layer and exact command/status, actual E2E surface, post-failure fixes, final result, and blockers plus reachable checks. For each stable `COV`/`GAP`, record independently verified disposition, refreshed `Covered`/`Partial`/`Missing` status where applicable, evidence/rationale, remaining gaps, and command/result or why not run. Reconcile all plan/report IDs; update inventory, exclusions, unreviewed areas, and limits to match verification. Mark anything not run; never claim unexercised verification.

      ## Final output

      ### Results
      - Formatter/linter/typecheck
      - Unit/integration/E2E
      - CI safety and reproducibility

      ### Repairs
      - Real defects fixed and checks rerun, or `none` with evidence

      ### Blockers
      - Exact blocker and completed reachable work, or `none`

      ### Artifacts
      - Gap plan, implementation report, and verification report.
    output_file: test-ci-verification.md
    timeout: 1h
after-pr:
  follow-up:
    workflow_call: ./_shared/after-pr.yaml
    flag: [after_pr, merge]
    with:
      resolve_conflict_prompt: |-
          Original request: {input}

          Approved plan: {plan}. Read it only when non-empty and relevant; otherwise use the original request.

          Task/report scope: use the test gap plan, implementation report, and current task changes:
          {file:test-ci-gap-plan.md}
          {file:test-ci-implementation.md}

          A conflict occurred while synchronizing PR/MR #{pr.number} ({pr.url}) with its base branch. Resolve only this conflict within the approved test/CI scope and preserve unrelated work. Never weaken or disable tests, scanners, assertions, or CI policy to get green.
      fix_ci_error_scope: |-
          Use the test gap plan, implementation report, verification report, and current PR changes:
          {file:test-ci-gap-plan.md}
          {file:test-ci-implementation.md}
          {file:test-ci-verification.md}
  squash-merge:
    flag: merge
    squash-merge: true
    timeout: 10m
    if:
      fail: follow-up/sync-base

