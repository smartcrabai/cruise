languages:
  pr: English
cleanup_after_pr: true
groups:
  verify-review:
    if:
      file-changed: verify-review-pass/verify-plan-implementation
    max_retries: 3
    steps:
      verify-plan-implementation:
        prompt: |-
          Verify that the implementation fully satisfies every requirement in {plan} before wiring verification.

          **Steps:**
          1. Read {plan} completely. Treat every requirement, acceptance criterion, constraint, and requested integration as mandatory.
          2. Inspect all relevant production code, tests, and execution paths—not only the current diff.
          3. Map each plan item to concrete implemented behavior. Check normal, error, boundary, and integration behavior where the plan requires them.
          4. If anything is missing, partial, stubbed, test-only, or inconsistent with {plan}, implement the smallest complete fix now. Add or update tests only when needed to cover the missing behavior.
          5. If you changed files, run the build or type checker and the tests and confirm they pass. Do not stop at defining symbols; ensure planned behavior is actually executed.
          6. If all plan items are already implemented, make no changes and state that explicitly.

          **Required output (include the heading)**

          ## Plan Implementation Verification Result

          - For each plan item, state the implemented behavior with file:line references, or the fix made
          - State build and test results when changes were made
          - State any plan item intentionally not implemented, with the reason
      verify-wiring:
        prompt: |-
          Verify that the implemented feature is actually wired into the production execution paths.

          **Background**: Even if functions and types are defined and the tests pass, a feature that is unreachable from any entry point is the same as a feature that does not exist. This step exists to prevent work from being marked complete while it is "implemented but never called from the main flow".

          **Steps:**
          1. From the changes made in this task (uncommitted changes plus commits since the base branch), list the functions, classes, types, constants, and exports that were added or modified.
          2. For each of them, verify via grep that it is referenced from production code other than test code.
          3. Treat anything referenced only by tests as "unwired": consult {plan} and wire it into a call path from an entry point (main, router, CLI command definition, UI event, DI registration, plugin registration, etc.).
          4. If new config keys, CLI flags, or environment variables were introduced, confirm that both the reading side and the passing side exist and that values actually propagate end to end.
          5. If you added or fixed any wiring, rerun the build and the tests and confirm everything passes.

          **Judgment criteria:**
          - If wiring is intentionally unnecessary (e.g. library code whose purpose is to be exported as a public API), you may skip it, but state the reason explicitly in the output.

          **Required output (include the headings)**

          ## Wiring Verification Result

          - For each new symbol, where it is referenced from production code (file:line)
          - If unwired code was fixed, what was done and the rerun build/test results
          - Anything judged as not needing wiring, with the reason
      verify-docs:
        prompt: |-
          Verify that the documentation and the user-facing strings were updated along with the code changes in this task.

          **Background**: Code that behaves differently from what the docs, the README, the Agent Skills, the `--help` output, or the error messages say is a defect for the user even when every test passes. This step exists to catch documentation and message drift before the change is marked complete.

          **Steps:**
          1. Collect the change set of this task: unstaged and staged changes (`git diff`, `git diff --cached`), untracked source files from `git status --porcelain`, and commits since the base branch.
          2. From that change set, list the user-visible contract changes: CLI commands/flags/arguments, config keys, environment variables, public APIs and their signatures, file formats, default values, behavior and workflow changes, and removed features.
          3. For each of them, grep the repository for the places that describe it and check whether they match the new behavior:
             - README files (root and per-package/per-directory)
             - documentation under `docs/`, `doc/`, guides, tutorials, changelogs
             - Agent Skills (`SKILL.md` and the files it references, e.g. under `skills/`, `.claude/skills/`, `~/.claude/skills/` when the repo owns them), including the skill `description` frontmatter used for triggering
             - `CLAUDE.md` / `AGENTS.md` and other agent instruction files
             - configuration samples, `.env.example`, templates
             - doc comments and generated API docs
          4. Check the user-facing strings in the code itself:
             - help/usage text, subcommand and flag descriptions, `--help` output, shell completions, man pages
             - error, warning, and validation messages: do they still name the right flag, key, path, command, and remedy? Are messages for removed paths deleted, and are messages for new failure modes present?
             - log messages and any user-visible text asserted by tests
          5. Fix every mismatch you find now, with the smallest edit that makes the description match the behavior. Delete descriptions of removed behavior instead of leaving them stale.
          6. If you changed any file, run the build/type check and the tests and confirm they pass (string assertions in tests often break with message edits).

          **Judgment criteria:**
          - Only documentation and messages affected by this task's changes are in scope. Pre-existing inaccuracies unrelated to the change set are out of scope: state them in the output, do not fix them.
          - Purely internal refactoring with no user-visible contract change needs no documentation update; say so explicitly instead of inventing edits.
          - Never end your turn with a question to the user. This step runs unattended, so nobody can answer it.

          **Required output (include the heading)**

          ## Documentation and Message Verification Result

          - For each user-visible contract change, the documents and messages that describe it (file:line) and whether they were already correct or were updated
          - What was updated, with file:line
          - Build and test results when changes were made
          - Anything judged as needing no update or as out of scope, with the reason
      simplify-pass:
        prompt: |-
          Review the changes made in this task (uncommitted changes plus commits since the base branch)
          as a lazy senior developer would, cut the over-engineering, and apply the cuts in this same
          step. Lazy means efficient, not careless. The best code is the code never written, and the
          diff's best outcome is getting shorter.

          **Scope: code reduction only.** Correctness bugs, security holes, and broken behavior are the
          review-pass step's job — do not hunt for them here and do not report them as findings.
          Every cut in this step must preserve behavior; a "cut" that changes behavior is not a cut.

          **Prerequisite: never be lazy about understanding.**
          Before judging anything, read every file the change touches and trace the real execution flow end to end.
          Shrinking a diff without comprehension is the dangerous kind of laziness: it ships a confident wrong fix.

          ## Phase 1 — Gather the diff

          Collect the complete change set: commits since the base branch (`git diff <base>...HEAD`),
          unstaged and staged changes (`git diff`, `git diff --cached`), and untracked source files
          from `git status --porcelain`. Treat this as the review scope.

          ## Phase 2 — Find cuts (5 perspectives, run in parallel)

          **Run the perspectives in parallel.** If a subagent/task tool is available, launch them
          concurrently — one perspective per subagent — each given a self-contained input: the complete
          diff, the relevant file paths, and the full text of its perspective. No subagent may depend on
          another's output. If no such tool is available, work through all perspectives yourself in
          sequence; never skip one for lack of fan-out.

          Each perspective reports candidates as `file`, `line`, a one-line `summary`, the concrete cost
          (what is duplicated, wasted, or harder to maintain), and the replacement (what the code
          becomes; for deletions: nothing).

          The perspectives follow the lazy ladder — when two apply to the same code, the lower-numbered
          one wins:

          1. **YAGNI / delete** — does this need to exist at all? Flag speculative abstractions (an
             interface with one implementation, a factory for one product, config for a value that never
             changes), boilerplate and scaffolding "for later", fallbacks that aren't actually needed
             (`??`, `||`, `= defaultValue`), dead code and old exports left behind by a refactor, and
             functionality not requested in the task instructions. Replacement: nothing.
          2. **Reuse** — flag new code that re-implements something already available, in this order: a
             helper, util, type, or pattern already in this codebase (grep shared modules and files
             adjacent to the change), the standard library, a native platform feature (`<input type="date">`
             over a picker lib, CSS over JS, a DB constraint over app code), an already-installed
             dependency. Never a new dependency for what a few lines can do. Name the existing thing to
             call instead.
          3. **Shrink** — same logic, fewer lines: redundant or derivable state, copy-paste with slight
             variation, deep nesting, if/else branches calling the same function differing only by
             arguments. Show the shorter form.
          4. **Efficiency** — wasted work the diff introduces: redundant computation or repeated I/O,
             independent operations run sequentially, blocking work added to startup or hot paths,
             long-lived objects built from closures that keep the whole enclosing scope alive. Name the
             cheaper alternative.
          5. **Altitude / root cause** — check each change is implemented at the right depth, not as a
             bandaid. Special cases layered on shared infrastructure mean the fix isn't deep enough;
             prefer generalizing the underlying mechanism. For bug fixes, grep every caller of the
             touched function: one guard in the shared function beats a guard in every caller, and it
             also fixes the sibling callers the report never mentioned.

          ## Phase 3 — Dedup and self-check

          Pool all candidates. Dedup near-duplicates (same code, same cut → keep the lowest-numbered
          perspective's version). Re-check each remaining candidate against the actual files and discard
          anything whose removal would change behavior or that {plan} or the task instructions require.

          ## Phase 4 — Apply the cuts (in parallel where possible)

          Deletion over addition; the preferred fix is less code.

          **Parallelize the fixes.** Partition the cuts into groups whose file sets do not overlap and
          that do not depend on each other. If a subagent/task tool is available, dispatch each group to
          its own subagent and run the groups concurrently, each with its cuts and the context it needs;
          cuts that share files or interact go into a single group. If no such tool is available, apply
          all cuts yourself sequentially.

          Cutting rules:
          - Between two forms of the same size, take the one that's correct on edge cases. Boring over
            clever — clever is what someone decodes at 3am.
          - A deliberate simplification that cuts a real corner with a known ceiling (global lock, O(n²)
            scan, naive heuristic) gets a comment naming the ceiling and the upgrade path.
          - **Never simplify away:** input validation at trust boundaries, error handling that prevents
            data loss, security measures, accessibility basics, and anything explicitly requested by
            {plan} or the task instructions.

          ## Phase 5 — Verify

          After all cuts land, run the build (type check) and the tests and confirm everything passes.
          If a cut breaks them, revert that cut or fix it so it passes.

          **If there is nothing to cut:**
          Never end your turn with a question to the user.
          This step runs unattended, so nobody can answer it and the workflow would stall.
          Declare the intentional no-change with a reason before finishing, in one of two ways:
          - Call the `skip_step` tool with the reason in `reason`, if that tool is available.
          - Otherwise, include a line starting at the beginning of a line in your output: `NO_CHANGES_INTENTIONAL: <reason>`.

          **Required output (include the headings)**

          ## Simplification Result

          - What was cut, grouped by perspective, each with file:line and the replacement
          - Cut candidates intentionally left in place, with the reason
          - Net line delta (e.g. `net: -42 lines`)
          - Build and test results
      review-pass:
        prompt: |-
          Review the changes made in this task, then fix any findings in this same step.
          Execute the procedure below directly; do not depend on an external skill or command.

          **Scope: finding problems.** This step hunts for defects: bugs, broken behavior, security
          holes, missing tests, convention violations. Code reduction and over-engineering are the
          simplify-pass step's job — do not report them here.

          **This step runs inside a loop.** The surrounding workflow re-runs verification,
          simplification, and this review whenever an iteration changes any workspace file, and it
          stops looping only when a whole iteration changes nothing. Your job is to converge: fix
          real defects, and when none remain, change no workspace files so the loop can exit.
          Never invent findings to have something to say.

          Review phases are read-only: while reviewing, do not edit, stage, or commit workspace
          files, and do not suggest commands that mutate the git state. Only Phase 6 modifies
          workspace files, and only to fix findings from the review. The ledger described in
          Phase 0 lives outside the workspace and may be written at any time.

          ## Phase 0: Review ledger (carries findings across loop iterations)

          Compute the ledger path — it lives under the git directory, outside the reviewed
          workspace, so reading or writing it never counts as a workspace change:

              LEDGER="$(git rev-parse --git-dir)/cruise-review-ledger.md"

          - If "$LEDGER" does not exist, or its `head:` line differs from `git rev-parse HEAD`,
            or its `snapshot:` commit no longer resolves (`git cat-file -e <snapshot>` fails):
            this is the **first review** of this task. Delete any stale ledger and run
            Phases 1 through 6.
          - Otherwise this is a **re-review** after fixes: run the Re-review path below instead
            of Phases 1 through 4, then continue with Phases 5 and 6.

          Ledger format (plain markdown):

              # cruise review ledger
              head: <output of git rev-parse HEAD>
              snapshot: <commit id printed by git stash create right after this iteration's fixes; use HEAD when it prints nothing>
              iteration: <1, 2, ...>

              ## F1
              state: new | persists | resolved | wont-fix
              severity: critical | major | minor
              file: <path>:<line>
              summary: <one sentence>
              evidence: <why it is, or is no longer, a problem>

          ## Judgment rules (apply to all reviewing, both paths)

          - **Causal scope.** A finding is fixable only when this task's changes introduced the
            problem, or when an existing problem is one the changes depend on, expand, or newly
            expose. A pre-existing problem that merely shares a file, function, or call path with
            the diff is out of scope: record it in the ledger as `wont-fix` with the reason and do
            not change code for it. Proximity is not scope authority.
          - **Quality-gate causality.** Before treating a failed build, type check, or test as a
            finding or widening a fix because of it, verify a causal connection to the current
            diff or to behavior the diff must preserve — for example the failure disappears on
            the base branch, or the failing path references changed code. A failure with no
            verified connection is recorded as `wont-fix`, never fixed here.
          - **Suggestions are not findings.** Style preferences, refactoring ideas, speculative
            hardening, and "could be cleaner" never justify a code change in this step, no matter
            how cheap the change looks.
          - **Unconditional verdicts.** A reviewer result is either concrete findings or the
            literal text NO FINDINGS. Hedged conclusions ("fine as long as...", "probably OK")
            are neither findings nor approvals; resolve the condition by reading the code first.
          - **Reopen discipline.** A `resolved` finding stays closed unless you have all three:
            reproduction steps, expected vs. actual result, and failing file:line evidence.
            Without all three, do not reopen and do not re-report it under a new ID.
          - Every finding needs a concrete reproduction condition (input, sequence, or state).
            Do not report unsupported possibilities or speculation.

          ## Re-review path (ledger exists, head matches, snapshot resolves)

          Do not re-run the full first-review sweep and do not re-litigate code that has not
          changed since the previous iteration.

          1. **Fix delta.** The new code to review is `git diff <snapshot>` (the ledger's
             `snapshot:` value) plus any untracked source files from `git status --porcelain`
             not yet covered by a ledger entry.
          2. **Verify prior findings.** For each ledger finding in state `new` or `persists`,
             check the current code: mark it `resolved` with concrete evidence (file:line of the
             fix and what now satisfies the original finding), or `persists` with current
             evidence. The mere presence of a fix attempt is not resolution.
          3. **Review the delta only**, applying the first-review perspectives 1-6 (correctness,
             removed behavior, cross-file impact, language pitfalls, AI antipattern, security) to
             the delta, hunting regressions introduced by the fixes. New findings must lie in the
             delta or be fix-induced; continue ID numbering after the existing ledger entries.
          4. Continue with Phase 5 (report) and Phase 6 (fix).


          ## Phase 1: Gather the diff (first review only)

          Inspect the complete working-tree change before reviewing anything. Do not review only one kind of diff.

          1. Run `git diff` for unstaged changes to tracked files.
          2. Run `git diff --cached` for staged changes.
          3. Run `git status --porcelain` to identify untracked files (`??` entries).
          4. Read untracked files that look like source code (not binaries, lockfiles, generated output, or vendored content) and include them in the review. Skip large files, binaries, and clearly generated output.

          If all three checks are empty, state that there is nothing to review and stop.
          Do not invent findings for an empty diff.


          ## Phase 2: Discover project-specific perspectives (first review only)

          1. List `./.review/*.md`. If the directory does not exist or matches no files, apply generic perspectives only and state that plainly in the final report.
          2. For each perspective file, first read only its YAML frontmatter and its "When to apply" section to judge relevance to this diff.
          3. Drop perspectives that are clearly irrelevant (for example, a database-migration-safety perspective when the diff contains no database changes). Pass only relevant perspectives to the next phase.
          4. For each relevant perspective, have its reviewer read the complete file, including frontmatter. If there are more than six relevant files, group them into batches of at most three per reviewer.


          ## Phase 3: Run the reviewers in parallel (first review only)

          Use the same complete diff for the nine generic reviewers below and for each relevant
          project-specific perspective.
          **Run the reviewers in parallel.** If a subagent/task tool is available, launch them
          concurrently — one reviewer per subagent — each with the self-contained input described below.
          Do not make any reviewer depend on another reviewer's output. If no such tool is available,
          work through every reviewer yourself in sequence; never skip one for lack of fan-out.
          If same-named review criteria (code-review, ai-antipattern, security-review, etc.) are available, they may add criteria, but an external skill invocation is not required; the criteria below are the minimum.

          1. **Correctness (line-by-line)**
             Read every hunk line by line, then the enclosing function of each hunk — bugs in unchanged
             lines of a touched function are in scope. For every line ask what input, state, timing, or
             platform makes it wrong: logic errors, inverted/wrong conditions, off-by-one, boundary
             values, null/undefined deref, missing `await`, falsy-zero checks, wrong-variable
             copy-paste, errors swallowed in a catch, state handling, and races.
             When the diff adds or modifies a type that wraps another (cache, proxy, decorator, adapter),
             check that every method routes through the wrapped instance — not back through a
             registry/session/global — and that the wrapper forwards all the methods callers actually use.
          2. **Removed behavior and functional impact**
             For every line the diff deletes or replaces, name the invariant or behavior it enforced,
             then find where the new code re-establishes it. If you can't find it, that's a finding: a
             removed guard, a dropped error path, a narrowed validation, a deleted test that covered a
             real case.
             Also check for lost or degraded existing functionality, unintended new constraints, and
             hardcoded assumptions that unnecessarily close foreseeable extension points.
          3. **Cross-file impact and backward compatibility**
             For each changed function, grep its callers and check whether the change breaks any call
             site: a new precondition, a changed return shape, a new exception, an ordering dependency.
             Check callees too: does a parallel change in the same diff make a call unsafe?
             Also check whether public signatures, endpoints, fields, serialization formats, or
             configuration formats are broken for existing consumers. Skip the compatibility half only
             when the user or project explicitly permits breaking changes, and record the reason in the
             final report. When uncertain, run it.
          4. **Language pitfalls, edge cases, and failure paths**
             Check the classic pitfalls of the diff's language/framework — for example: JS falsy-zero,
             `==` coercion, closure-captured loop vars; Python mutable default args, late-binding
             closures; Go nil-map writes, range-var capture; timezone/DST drift; float equality.
             Also check failures from I/O and external calls, empty/zero/maximum values, Unicode,
             concurrency, abnormal inputs, resource cleanup, and inconsistent state after partial failure.
          5. **AI antipattern**
             Check for implementations that answer a different question, patterns found nowhere else in
             the codebase, and overly generic solutions to a narrow problem.
             Check for hallucinated or deprecated APIs, syntactically valid but semantically wrong code,
             unwired parameters or fields, and copy-paste inconsistencies.
             (Premature abstractions, dead code, and unjustified fallbacks belong to simplify-pass; skip them here.)
          6. **Security**
             Check SQL, command, and template injection; broken authentication or authorization; hardcoded secrets; unsafe deserialization; path traversal; SSRF; insecure cryptography or randomness; sensitive data in logs; and insecure defaults.
          7. **Test sufficiency**
             Check whether tests were added or updated for changed behavior, whether stale assertions remain, and whether removed behavior left orphaned tests.
             Read relevant existing tests; the diff alone is insufficient to judge what was already covered.
          8. **Unit-test coverage**
             Check normal, error/abnormal, and boundary cases, and verify that assertions check real outcomes rather than merely "does not throw".
             Read relevant existing tests to identify untested paths remaining after this diff.
          9. **Conventions (CLAUDE.md)**
             Read the CLAUDE.md files that govern the changed code (user-level, repo root, and any in
             ancestor directories of changed files) and check the diff for clear violations. Only flag a
             violation when you can quote the exact rule and the exact line that breaks it — no style
             preferences, no "spirit of the doc" inferences. Name the CLAUDE.md path and quote the rule
             in the finding.

          Assign reviewers to each relevant project-specific perspective as well.
          Every reviewer must report only confident findings with a concrete reproduction condition (input, sequence, or state).
          Do not report style preferences, unsupported possibilities, or speculation without a concrete failure scenario.
          If there are no findings, the reviewer must return the literal text `NO FINDINGS`.

          Give each reviewer a self-contained input containing:
          - The complete `git diff` and `git diff --cached` output
          - Paths and contents of untracked source files reported by `git status --porcelain`
          - Complete contents of the project-specific perspective files assigned to that reviewer
          - For test-sufficiency and unit-test-coverage reviewers, paths of relevant existing test files and an explicit instruction to read them
          Do not make any reviewer depend on another reviewer's output. Every reviewer uses the same complete diff.

          Every reviewer must follow the Judgment rules above.

          Every finding must use exactly this format:

          FINDING
          file: <path>
          line: <number or range>
          severity: critical | major | minor
          perspective: <generic dimension name or custom perspective name>
          summary: <one sentence>
          detail: <why it is a problem and a concrete failure scenario>


          ## Phase 4: Deduplicate, consolidate, and sweep for gaps (first review only)

          Treat findings as duplicates when they identify the same root cause at the same location (same file and overlapping line ranges).
          When merging duplicates, keep the highest severity and the clearest, most concrete explanation.
          List every perspective that identified the finding.
          Before finalizing, re-check questionable findings against the actual files and discard anything unsupported or contradicted by the code.
          Do not inflate the report with low-confidence findings.

          Then take one more pass yourself as a fresh reviewer holding the deduplicated list, looking
          ONLY for defects not already on it: moved or extracted code that dropped a guard, second-tier
          footguns (defaults evaluated once, lock-scope shrink, predicate methods with side effects),
          setup/teardown asymmetry in tests, config defaults flipped. If nothing new, add nothing — do
          not pad.


          ## Phase 5: Report in English

          Use this structure. Omit severity sections with no findings.

          Give every finding a stable ID (F1, F2, ... — on re-reviews, continue numbering from
          the ledger) and prefix each finding line with it. On re-reviews, also list the prior
          findings with their updated states (`resolved` / `persists`) and evidence.

          # Review Report: Uncommitted Changes
          ## Summary
          State the diff scope, overall assessment, and counts by severity in one to three sentences.
          ## Findings
          ### Critical
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ### Major
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ### Minor
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ## Perspectives applied
          - Generic: correctness, removed behavior and functional impact, cross-file impact and backward compatibility (or why compatibility was skipped), language pitfalls / edge cases / failure paths, AI antipattern, security, test sufficiency, unit-test coverage, conventions (CLAUDE.md)
          - Project-specific (`./.review/`): files used, files excluded as irrelevant, or no matching files


          ## Phase 6: Fix the findings (in parallel where possible)

          Address every finding from the Phase 5 report that needs attention.

          **Parallelize the fixes.** Partition the findings into groups whose file sets do not overlap
          and that do not depend on each other. If a subagent/task tool is available, dispatch each group
          to its own subagent and run the groups concurrently, each with its findings and the context it
          needs; findings that share files or interact go into a single group. If no such tool is
          available, apply all fixes yourself sequentially.

          - Apply the smallest correct fix for each finding. Update or add tests when a fix requires it.
          - If you judge a finding to be a false positive, do not change code for it; record the finding and the reason you skipped it in the final output.
          - If there are no findings, change nothing and state that plainly.
          - Do not fix unrelated issues outside the report's findings.

          After all fixes land, run the build (type check) and the relevant tests once over the combined
          result and confirm everything passes.

          Then update the ledger at "$LEDGER" (create it on the first review):
          - `head:` = current `git rev-parse HEAD`
          - `snapshot:` = output of `git stash create` run after all fixes landed (HEAD when it
            prints nothing)
          - `iteration:` incremented (1 on the first review)
          - every finding with its final state: `resolved` for findings fixed here and confirmed
            by the build and tests, `persists` for findings that remain, `wont-fix` for false
            positives and out-of-causal-scope records, each with evidence
          Write the ledger even when there were no findings, so later iterations recognize this
          task and stay scoped.


          ## Final output

          Output the Phase 5 review report first, then add this section:

          ## Fix Result

          - For each finding: fixed (with file:line), or skipped as a false positive (with the reason)
          - Build and test results when changes were made
          - If there were no findings, a plain statement that nothing was changed
          - Ledger state: iteration number and each finding ID with its state
steps:
  mise-trust:
    command: |-
      mise trust || true
  write-test-first:
    prompt: |-
      Based on {plan}, create **test code only**.
      The production code implementation will be done in the next step.
      Do not write any non-test logic in this step.

      **Why write only tests:**
      The purpose of test-first is to specify "what to build" in code before starting implementation.
      If you write the implementation too, the tests become a rubber-stamp of the implementation rather than a specification, and you lose the chance to notice design flaws.
      Tests are expected to fail at this point; write them on the assumption they will pass once implementation is complete.

      **Steps:**
      1. Review the plan report and understand the planned behavior and interfaces.
      2. Examine the existing code and tests in the target module to understand the test patterns.
      3. Write unit tests for the planned feature.
      4. Decide whether integration tests are needed, and write them if so:
         - Is there a data flow spanning three or more modules?
         - Does a new status/state join an existing workflow?
         - Does a new option propagate all the way through the call chain?
         - Is the new feature triggered from an existing entry point (CLI command, API endpoint, UI event, etc.)?
         - If any of these apply, write an integration test.
         - When the feature is triggered from an entry point, include at least one test that exercises the behavior through that entry point instead of calling the new function directly.
      5. Run the type checker/build and confirm the test code has no syntax errors.

      **On creating stubs to make the build pass:**
      Only when a function or type referenced by a test is undefined and the build fails,
      place a **minimal stub only** on the implementation side.
      The stub body must always be an "unimplemented" marker:
      - Rust: `todo!()` / `unimplemented!()`
      - TypeScript / JavaScript: `throw new Error("not implemented")`
      - Go: `panic("not implemented")`
      - Python: `raise NotImplementedError`

      Never write even a single line of real logic inside a stub.
      "It's easy, so I'll just implement it while I'm at it" is forbidden. If you feel the urge, that's work for the next step.

      **Test-writing policy:**
      - Follow the project's existing test patterns (naming conventions, directory layout, helpers).
      - Write tests using a Given-When-Then structure.
      - One test, one concept. Don't mix multiple concerns into a single test.
      - Cover the happy path, error cases, boundary values, and edge cases.

      **If the plan explicitly states that no tests will be added:**
      Follow the plan and do not write new test code.
      Even then, never end your turn with a question to the user.
      This step runs unattended, so nobody can answer it; the step would finish with no file changes and be retried until the workflow aborts.
      Instead, declare the intentional no-change with a reason before finishing, in one of two ways:
      - Call the `skip_step` tool with the reason in `reason`, if that tool is available.
      - Otherwise, include a line starting at the beginning of a line in your output: `NO_CHANGES_INTENTIONAL: <reason>`.
      Either one lets the workflow move on to the next step despite the lack of file changes.
    if:
      no-file-changes: failed
  implement-after-tests:
    prompt: |-
      Following the plan in {plan}, implement the code so that the tests pass.

      **Important**: The tests have already been written. Implement the code so the existing tests pass.
      - Review the existing test files to understand the expected behavior.
      - Implement the production code so the tests pass.
      - Defining functions and types is not the end of the implementation. Wire them into the existing execution paths (entry points, routing, command definitions, event handlers, etc.) so the feature is actually invoked.
      - Since tests are already written, you generally don't need to add more, but you may add tests if necessary.
      - You may modify tests if a fix requires it.
      - Running the build is mandatory. After implementing, run the build (type check) and confirm there are no type errors.
      - Running the tests is mandatory. After the build succeeds, always run the tests and confirm all of them pass.
      - If you introduce a new contract string such as a file name or config key, define it as a constant in a single place.

      **Required self-check before completing implementation:**
      Before running the build and tests, confirm the following:
      - If you added a new parameter/field, verified via grep that it is actually passed in from the callers.
      - Verified via grep that every newly defined function/class/type/constant is referenced from production code other than tests (i.e. reachable from an entry point). Code referenced only by tests is unwired and therefore incomplete.
      - Where you use `??`, `||`, or `= defaultValue`, verified the fallback is actually necessary.
      - Confirmed that code/exports replaced during refactoring haven't been left behind.
      - Confirmed you haven't added functionality that wasn't requested in the task instructions.
      - Confirmed no if/else branches call the same function differing only by arguments.
      - Confirmed the new code matches existing implementation patterns (API call style, type definition style, etc.).

      **Required output (include the headings)**
      ## Summary
      - Overview of the work performed
      ## Changes
      - Overview of the changes
      ## Build Result
      - Build execution result
      ## Test Result
      - Test command and result
    if:
      no-file-changes: failed
  verify-review-pass:
    group: verify-review
after-pr:
  pr-ready:
    command: |-
      gh pr ready {pr.number}
  sync-base:
    command: |
      base=$(gh pr view {pr.number} --json baseRefName -q '.baseRefName')
      git fetch origin "$base"
      git merge "origin/$base" --no-edit
  resolve-conflict:
    skip: prev.success
    prompt: |
      A conflict with the base branch occurred during `git merge`.
      Check the unresolved files with `git status`, resolve all conflict
      markers (<<<<<<<), then run `git add <files>` / `git commit`.
      There is no need to push — the next step handles that.
  push-after-sync:
    command: |-
      git push
  wait-ci:
    command: |-
      gh pr checks {pr.number} --watch
  fix-ci-error:
    skip: prev.success
    prompt: |
      The GitHub Actions CI for PR #{pr.number} is failing.
      Identify the failing check with `gh pr checks {pr.number}`,
      check the detailed logs with `gh run view <run-id> --log-failed` or similar, and fix the cause.
      After fixing it, update the PR branch with git add / commit / push.
    if:
      file-changed: sync-base
    next: wait-ci
