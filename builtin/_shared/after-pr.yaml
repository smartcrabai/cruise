inputs: [resolve_conflict_prompt, fix_ci_error_prompt]
steps:
  pr-ready:
    command: |-
      case "{pr.url}" in
        */-/merge_requests/*) glab mr update {pr.number} --ready ;;
        *) gh pr ready {pr.number} ;;
      esac
  sync-base:
    command: |-
      cruise internal sync-base {pr.number} --url {pr.url}
  resolve-conflict:
    skip: prev.success
    allow_commit: true
    permission: full
    prompt: "{inputs.resolve_conflict_prompt}"
  push-after-sync:
    command: |-
      git push
  wait-ci:
    timeout: 30m
    command: |-
      diagnostic_payload='{{"checks":[],"truncated":false}}'
      ci_diagnostic() {{
        diagnostic_state=$state
        case "$diagnostic_state" in
          unobserved|SUCCESS|FAILURE|ERROR|PENDING|EXPECTED|stale-rollup|not-registered|no-checks|success|failed|canceled|cancelled|skipped|running|pending|created|waiting_for_resource|preparing|scheduled|manual|unknown) ;;
          *) diagnostic_state=unknown ;;
        esac
        diagnostic_head_matches=$head_matches
        case "$diagnostic_head_matches" in
          true|false|unknown) ;;
          *) diagnostic_head_matches=unknown ;;
        esac
        diagnostic_check_count=$check_count
        case "$diagnostic_check_count" in
          ''|*[!0-9]*) diagnostic_check_count=unknown ;;
          *) if [ "${{#diagnostic_check_count}}" -gt 18 ]; then diagnostic_check_count=unknown; fi ;;
        esac
        diagnostic_http_status=$http_status
        case "$diagnostic_http_status" in
          [12345][0123456789][0123456789]) ;;
          *) diagnostic_http_status=unknown ;;
        esac
        payload_bytes=$(printf '%s' "$diagnostic_payload" | wc -c | tr -d '[:space:]')
        if [ "$payload_bytes" -gt 16000 ]; then
          diagnostic_payload=$(printf '%s' "$diagnostic_payload" | jq -ac '.checks |= map(del(.url)) | .truncated = true') || diagnostic_payload='{{"checks":[],"truncated":true}}'
          payload_bytes=$(printf '%s' "$diagnostic_payload" | wc -c | tr -d '[:space:]')
        fi
        if [ "$payload_bytes" -gt 16000 ]; then
          diagnostic_payload=$(printf '%s' "$diagnostic_payload" | jq -ac '.checks |= map(del(.url,.run_id,.job_id)) | .truncated = true') || diagnostic_payload='{{"checks":[],"truncated":true}}'
        fi
        printf 'CRUISE_CI_DIAGNOSTIC_V4 %s %s %s %s %s %s %s\n' "$provider" "$1" "$diagnostic_state" "$diagnostic_head_matches" "$diagnostic_check_count" "$diagnostic_http_status" "$diagnostic_payload" >&2
      }}
      github_page() {{
        printf '%s' "$1" | jq -ac --argjson total "$check_count" --arg repo_owner "$owner" --arg repo_name "$name" '
          def clean_id:
            if type == "number" then
              if . > 0 and . == floor then
                tostring | if test("^[1-9][0-9]{{0,19}}$") then . else null end
              else null end
            else null end;
          def clean_url:
            if type != "string" then null
            else
              (try (capture("^(?<scheme>[Hh][Tt][Tt][Pp][Ss]?)://(?<authority>[^/?#]+)(?<path>[^?#]*)") // null) catch null) as $parts
              | if $parts == null then null
                else
                  ($parts.authority | split("@") | .[-1]) as $host
                  | if ($host | test("^([A-Za-z0-9.-]+|\\[[0-9A-Fa-f:.]+\\])(:[0-9]{{1,5}})?$"))
                      and ($parts.path | test("^(?:/(?:[A-Za-z0-9._~!$&()*+,;=:@-]|%[0-9A-Fa-f]{{2}})*)*$")) then
                      (("\($parts.scheme | ascii_downcase)://\($host)\($parts.path)") as $url
                       | if ($url | utf8bytelength) <= 1024 then $url else null end)
                    else null
                    end
                end
            end;
          def actions_job_id($url; $run_id; $owner; $name):
            if $url == null then {{job_id:null,bad:false}}
            elif ($url | contains("/actions/runs/") | not) then {{job_id:null,bad:false}}
            else
              (try ($url | (capture("^https?://[^/]+/(?<owner>[^/]+)/(?<repo>[^/]+)/actions/runs/(?<run_id>[^/]+)/job/(?<job_id>[^/]+)$") // null)) catch null) as $parts
              | if $parts == null then {{job_id:null,bad:true}}
                elif ($parts.owner | ascii_downcase) != ($owner | ascii_downcase)
                  or ($parts.repo | ascii_downcase) != ($name | ascii_downcase)
                  or ($parts.run_id | test("^[1-9][0-9]{{0,19}}$") | not)
                  or ($parts.job_id | test("^[1-9][0-9]{{0,19}}$") | not)
                  or $run_id == null
                  or $parts.run_id != $run_id then {{job_id:null,bad:true}}
                else {{job_id:$parts.job_id,bad:false}}
                end
            end;
          def classify:
            if type != "object" then {{check:null,bad:true}}
            else . as $node
            | if $node.__typename == "CheckRun" then
                if ($node.checkSuite | type) == "object"
                  and ($node.checkSuite.workflowRun | type) == "object"
                  and $node.checkSuite.status == "COMPLETED"
                  and (["FAILURE","TIMED_OUT","CANCELLED","ACTION_REQUIRED","STARTUP_FAILURE","STALE"] | index($node.checkSuite.conclusion)) != null then
                  {{check:{{name:$node.name,state:$node.checkSuite.conclusion,run_id:$node.checkSuite.workflowRun.databaseId,url:$node.detailsUrl,run_expected:true,url_expected:true,checkrun:true}},bad:false}}
                elif ($node.status | type) != "string" or $node.status == "" then {{check:null,bad:true}}
                elif $node.status == "COMPLETED" then
                  if ($node.conclusion | type) != "string" then {{check:null,bad:true}}
                  elif (["FAILURE","TIMED_OUT","CANCELLED","ACTION_REQUIRED","STARTUP_FAILURE","STALE"] | index($node.conclusion)) != null then
                    {{check:{{name:$node.name,state:$node.conclusion,run_id:(if ($node.checkSuite | type) != "object" then null elif ($node.checkSuite.workflowRun | type) != "object" then null else $node.checkSuite.workflowRun.databaseId end),url:$node.detailsUrl,run_expected:(if ($node.checkSuite | type) != "object" then true else $node.checkSuite.workflowRun != null end),url_expected:true,checkrun:true}},bad:false}}
                  elif (["SUCCESS","NEUTRAL","SKIPPED"] | index($node.conclusion)) != null then {{check:null,bad:false}}
                  else {{check:null,bad:true}}
                  end
                elif (["QUEUED","IN_PROGRESS","WAITING","PENDING","REQUESTED"] | index($node.status)) != null then {{check:null,bad:false}}
                else {{check:null,bad:true}}
                end
              elif $node.__typename == "StatusContext" then
                if (["FAILURE","ERROR"] | index($node.state)) != null then
                  {{check:{{name:$node.context,state:$node.state,url:$node.targetUrl,url_expected:($node.targetUrl != null),checkrun:false}},bad:false}}
                elif (["SUCCESS","PENDING","EXPECTED"] | index($node.state)) != null then {{check:null,bad:false}}
                else {{check:null,bad:true}}
                end
              else {{check:null,bad:true}}
              end
            end;
          def clean: gsub("[\u0000-\u001f\u007f-\u009f]";"") | gsub("^\\s+|\\s+$";"") | .[0:128];
          .data.repository.object.statusCheckRollup.contexts as $contexts
          | (($contexts | type) == "object") as $contexts_valid
          | (($contexts.nodes | type) == "array") as $nodes_valid
          | (if $nodes_valid then $contexts.nodes else [] end) as $nodes
          | ($nodes | map(classify)) as $classified
          | ([$classified[] | select(.check != null) | .check]) as $candidates
          | ($candidates | map(
              . as $candidate
              | if ($candidate.name | type) == "string" then
                  ($candidate.name | clean) as $name
                  | ($candidate.run_id | clean_id) as $run_id
                  | ($candidate.url | clean_url) as $url
                  | (if $candidate.checkrun then actions_job_id($url; $run_id; $repo_owner; $repo_name) else {{job_id:null,bad:false}} end) as $job
                  | if $name == "" then {{check:null,bad:true}}
                    else
                      {{check:({{name:$name,state:$candidate.state}} + (if $candidate.run_expected and $run_id != null then {{run_id:$run_id}} else {{}} end) + (if $job.job_id != null then {{job_id:$job.job_id}} else {{}} end) + (if $url != null then {{url:$url}} else {{}} end)),
                        bad:($name != $candidate.name or ($candidate.run_expected and $run_id == null) or ($candidate.url_expected and $url == null) or ($candidate.url != null and $url != $candidate.url) or $job.bad)}}
                    end
                else {{check:null,bad:true}}
                end
            )) as $sanitized
          | ([$sanitized[] | select(.check != null) | .check]) as $valid
          | ($contexts.pageInfo // {{}}) as $page
          | (($contexts.totalCount | type) == "number" and $contexts.totalCount == $total) as $total_valid
          | (($page | type) == "object" and ($page.hasNextPage | type) == "boolean") as $page_valid
          | ($page_valid and $page.hasNextPage) as $more
          | (($page.endCursor | type) == "string" and $page.endCursor != "") as $cursor_valid
          | {{
              checks:$valid[:10],
              node_count:($nodes | length),
              truncated:(($contexts_valid | not) or ($nodes_valid | not) or ($total_valid | not) or ($page_valid | not) or ($more and ($cursor_valid | not)) or ([$classified[] | select(.bad)] | length) > 0 or ([$sanitized[] | select(.bad)] | length) > 0 or ($valid | length) > 10),
              more:$more,
              cursor:(if $cursor_valid then $page.endCursor else "" end)
            }}
        '
      }}
      collect_github_failures() {{
        checks='[]'
        details_truncated=false
        current_response=
        detail_page_available=true
        fetched_nodes=0
        seen_cursors=' '
        if ! current_response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f query="$detail_query" 2>"$diagnostic_stderr"); then
          details_truncated=true
          detail_page_available=false
        fi
        while [ "$detail_page_available" = true ]; do
          if ! printf '%s' "$current_response" | jq -e --arg head "$expected_head" '((.errors // []) | (type == "array" and length == 0)) and .data.repository.pullRequest.headRefOid == $head and .data.repository.object.oid == $head' >/dev/null 2>&1; then
            details_truncated=true
            break
          fi
          if ! page=$(github_page "$current_response" 2>/dev/null); then
            details_truncated=true
            break
          fi
          page_checks=$(printf '%s' "$page" | jq -ac '.checks')
          page_node_count=$(printf '%s' "$page" | jq -r '.node_count')
          fetched_nodes=$((fetched_nodes + page_node_count))
          if [ "$(printf '%s' "$page" | jq -r '.truncated')" = true ]; then details_truncated=true; fi
          merged=$(jq -ac -n --argjson old "$checks" --argjson new "$page_checks" '$old + $new')
          merged_count=$(printf '%s' "$merged" | jq -r 'length')
          if [ "$merged_count" -gt 10 ]; then details_truncated=true; fi
          checks=$(printf '%s' "$merged" | jq -ac '.[0:10]')
          page_more=$(printf '%s' "$page" | jq -r '.more')
          if [ "$page_more" = true ] && [ "$page_node_count" -eq 0 ]; then
            details_truncated=true
            break
          fi
          if [ "$page_more" != true ]; then
            if [ "$fetched_nodes" -ne "$check_count" ]; then details_truncated=true; fi
            break
          fi
          if [ "$fetched_nodes" -ge "$check_count" ] || [ "$(printf '%s' "$checks" | jq -r 'length')" -ge 10 ]; then
            details_truncated=true
            break
          fi
          page_cursor=$(printf '%s' "$page" | jq -r '.cursor // ""')
          if [ -z "$page_cursor" ]; then
            details_truncated=true
            break
          fi
          case "$seen_cursors" in
            *" $page_cursor "*)
              details_truncated=true
              break ;;
          esac
          seen_cursors="$seen_cursors$page_cursor "
          if ! current_response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f after="$page_cursor" -f query="$detail_query" 2>"$diagnostic_stderr"); then
            details_truncated=true
            detail_page_available=false
          fi
        done
        if [ "$(printf '%s' "$checks" | jq -r 'length')" -eq 0 ]; then details_truncated=true; fi
        if ! diagnostic_payload=$(jq -ac -n --argjson checks "$checks" --argjson truncated "$details_truncated" '{{checks:$checks,truncated:$truncated}}'); then
          diagnostic_payload='{{"checks":[],"truncated":true}}'
        fi
      }}
      github_actions_status() {{
        actions_state=ready
        actions_seen=0
        suites_total=
        seen_cursors=' '
        if ! current_response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f query="$suite_query" 2>"$diagnostic_stderr"); then
          actions_state=pending
          return
        fi
        detail_page_available=true
        while [ "$detail_page_available" = true ]; do
          if ! printf '%s' "$current_response" | jq -e --arg head "$expected_head" '((.errors // []) | (type == "array" and length == 0)) and .data.repository.pullRequest.headRefOid == $head and .data.repository.object.oid == $head' >/dev/null 2>&1; then
            actions_state=pending
            return
          fi
          if ! page=$(printf '%s' "$current_response" | jq -ac '
            def classify_suite:
              . as $suite
              | if type != "object" then "invalid"
                elif ($suite | has("workflowRun") | not) then "invalid"
                elif $suite.workflowRun == null then "ignored"
                elif ($suite.workflowRun | type) != "object" then "invalid"
                elif $suite.status == "COMPLETED" then
                  if (["SUCCESS","NEUTRAL","SKIPPED"] | index($suite.conclusion)) != null then "ready"
                  elif (["FAILURE","TIMED_OUT","CANCELLED","ACTION_REQUIRED","STARTUP_FAILURE","STALE"] | index($suite.conclusion)) != null then "failed"
                  else "invalid" end
                elif (["QUEUED","IN_PROGRESS","WAITING","PENDING","REQUESTED"] | index($suite.status)) != null then "pending"
                else "invalid" end;
            .data.repository.object.checkSuites as $suites
            | (if ($suites.nodes | type) == "array" then $suites.nodes else [] end) as $nodes
            | ($suites.pageInfo // {{}}) as $info
            | ($nodes | map(classify_suite)) as $runs
            | {{
                valid:(($suites | type) == "object" and ($suites.totalCount | type) == "number" and ($info | type) == "object" and ($info.hasNextPage | type) == "boolean" and (if $info.hasNextPage then ($info.endCursor | type) == "string" and $info.endCursor != "" else true end)),
                total_count:$suites.totalCount,
                node_count:($nodes | length),
                pending: (([$runs[] | select(. == "pending" or . == "invalid")] | length) > 0),
                failed: (([$runs[] | select(. == "failed")] | length) > 0),
                more:($info.hasNextPage == true),
                cursor:(if ($info.endCursor | type) == "string" then $info.endCursor else "" end)
              }}
          '); then
            actions_state=pending
            return
          fi
          if [ "$(printf '%s' "$page" | jq -r '.valid')" != true ]; then
            actions_state=pending
            return
          fi
          page_total_count=$(printf '%s' "$page" | jq -r '.total_count')
          if [ -z "$suites_total" ]; then
            suites_total=$page_total_count
          elif [ "$suites_total" -ne "$page_total_count" ]; then
            actions_state=pending
            return
          fi
          page_node_count=$(printf '%s' "$page" | jq -r '.node_count')
          actions_seen=$((actions_seen + page_node_count))
          if [ "$(printf '%s' "$page" | jq -r '.failed')" = true ]; then
            actions_state=failed
            return
          fi
          if [ "$(printf '%s' "$page" | jq -r '.pending')" = true ]; then actions_state=pending; fi
          if [ "$(printf '%s' "$page" | jq -r '.more')" != true ]; then
            detail_page_available=false
            break
          fi
          if [ "$actions_seen" -ge "$suites_total" ] || [ "$page_node_count" -eq 0 ]; then
            actions_state=pending
            return
          fi
          page_cursor=$(printf '%s' "$page" | jq -r '.cursor')
          case "$seen_cursors" in
            *" $page_cursor "*)
              actions_state=pending
              return ;;
          esac
          seen_cursors="$seen_cursors$page_cursor "
          if ! current_response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f after="$page_cursor" -f query="$suite_query" 2>"$diagnostic_stderr"); then
            actions_state=pending
            return
          fi
        done
        if [ "$actions_seen" -ne "$suites_total" ]; then actions_state=pending; fi
      }}
      collect_gitlab_failures() {{
        if [ -z "$observed_pipeline_id" ] || ! printf '%s' "$1" | jq -e --argjson observed "$observed_pipeline_id" 'def valid_id: if type == "number" then . > 0 and . == floor and (tostring | test("^[1-9][0-9]{{0,19}}$")) else false end; . as $pipeline | type == "object" and ($pipeline.id | valid_id) and $pipeline.id == $observed' >/dev/null 2>&1; then
          diagnostic_payload='{{"checks":[],"truncated":true}}'
          gitlab_trace_jobs=
          return
        fi
        gitlab_details=$(printf '%s' "$1" | jq -ac '
          def clean_id:
            if type == "number" then
              if . > 0 and . == floor then
                tostring | if test("^[1-9][0-9]{{0,19}}$") then . else null end
              else null end
            else null end;
          def clean_url:
            if type != "string" then null
            else
              (try (capture("^(?<scheme>[Hh][Tt][Tt][Pp][Ss]?)://(?<authority>[^/?#]+)(?<path>[^?#]*)") // null) catch null) as $parts
              | if $parts == null then null
                else
                  ($parts.authority | split("@") | .[-1]) as $host
                  | if ($host | test("^([A-Za-z0-9.-]+|\\[[0-9A-Fa-f:.]+\\])(:[0-9]{{1,5}})?$"))
                      and ($parts.path | test("^(?:/(?:[A-Za-z0-9._~!$&()*+,;=:@-]|%[0-9A-Fa-f]{{2}})*)*$")) then
                      (("\($parts.scheme | ascii_downcase)://\($host)\($parts.path)") as $url
                       | if ($url | utf8bytelength) <= 1024 then $url else null end)
                    else null
                    end
                end
            end;
          def clean: gsub("[\u0000-\u001f\u007f-\u009f]";"") | gsub("^\\s+|\\s+$";"") | .[0:128];
          def known_job_status:
            . as $status
            | ["success","failed","canceled","cancelled","skipped","running","pending","created","waiting_for_resource","preparing","scheduled","manual","canceling"]
            | index($status) != null;
          . as $pipeline
          | ($pipeline.id | clean_id) as $run_id
          | (($pipeline.jobs | type) == "array") as $jobs_valid
          | (if $jobs_valid then $pipeline.jobs else [] end) as $jobs
          | [$jobs[] | select(type == "object" and .status == "failed")] as $failed
          | ($failed | map(
              . as $job
              | if ($job.name | type) == "string" then
                  ($job.name | clean) as $name
                  | ($job.id | clean_id) as $job_id
                  | ($job.web_url | clean_url) as $url
                  | if $name == "" then {{check:null,bad:true}}
                    else
                      {{check:({{name:$name,state:"failed"}} + (if $run_id != null then {{run_id:$run_id}} else {{}} end) + (if $job_id != null then {{job_id:$job_id}} else {{}} end) + (if $url != null then {{url:$url}} else {{}} end)),
                        bad:($name != $job.name or $run_id == null or $job_id == null or $url == null or ($job.web_url != null and $url != $job.web_url))}}
                    end
                else {{check:null,bad:true}}
                end
            )) as $sanitized
          | ([$sanitized[] | select(.check != null) | .check]) as $valid
          | {{
              checks:$valid[:10],
              truncated:(($jobs_valid | not) or ([$jobs[] | select(type != "object")] | length) > 0 or ([$jobs[] | select(type == "object" and ((.status | known_job_status) | not))] | length) > 0 or ($failed | length) == 0 or ([$sanitized[] | select(.bad)] | length) > 0 or ($valid | length) > 10 or $run_id == null),
              trace_jobs:(if ($pipeline.id | type) == "number" then [$failed[] | select((.id | type) == "number") | "\($pipeline.id) \(.id)"] else [] end)
            }}
        ' 2>/dev/null)
        if [ -z "$gitlab_details" ]; then
          diagnostic_payload='{{"checks":[],"truncated":true}}'
          gitlab_trace_jobs=
          return
        fi
        if ! diagnostic_payload=$(printf '%s' "$gitlab_details" | jq -ac '{{checks, truncated}}'); then
          diagnostic_payload='{{"checks":[],"truncated":true}}'
          gitlab_trace_jobs=
          return
        fi
        if ! gitlab_trace_jobs=$(printf '%s' "$gitlab_details" | jq -r '.trace_jobs[]?'); then
          diagnostic_payload='{{"checks":[],"truncated":true}}'
          gitlab_trace_jobs=
        fi
      }}
      case "{pr.url}" in
        */-/merge_requests/*)
          provider=gitlab
          observed_pipeline_id=
          state=unobserved
          head_matches=unknown
          check_count=unknown
          http_status=unknown
          attempt=0
          diagnostic_stderr="$(git rev-parse --git-dir)/cruise-ci-query.stderr"
          while [ "$attempt" -lt 30 ]; do
            if response=$(glab ci get --merge-request {pr.number} --output json 2>"$diagnostic_stderr"); then
              query_status=0
            else
              query_status=$?
            fi
            cat "$diagnostic_stderr" >&2
            if [ "$query_status" -ne 0 ]; then
              http_status=$(sed -n -e 's/.*: \([12345][0123456789][0123456789]\) .*/\1/p' -e 's/^\([12345][0123456789][0123456789]\) [A-Z].*/\1/p' "$diagnostic_stderr" | sed -n '1p')
              if [ -z "$http_status" ]; then http_status=unknown; fi
            else
              http_status=unknown
            fi
            if status=$(printf '%s' "$response" | jq -r '.status'); then
              status_parse_status=0
            else
              status_parse_status=$?
            fi
            case "$status" in
              success|failed|canceled|cancelled|skipped|running|pending|created|waiting_for_resource|preparing|scheduled|manual) state=$status ;;
              *) state=unknown ;;
            esac
            case "$status" in
              success) exit 0 ;;
              running|pending|created|waiting_for_resource|preparing|scheduled) ;;
              *)
                if [ "$query_status" -ne 0 ]; then
                  diagnostic_reason=api_error
                elif [ "$status_parse_status" -ne 0 ] || [ -z "$status" ] || [ "$status" = null ]; then
                  diagnostic_reason=invalid_ci_state
                elif [ "$status" = failed ]; then
                  diagnostic_reason=ci_failed
                else
                  diagnostic_reason=unknown_state
                fi
                if [ "$diagnostic_reason" = ci_failed ]; then
                  observed_pipeline_id=$(printf '%s' "$response" | jq -er 'select(type == "object") | .id | select(type == "number")' 2>/dev/null) || observed_pipeline_id=
                  if gitlab_details_response=$(glab ci get --merge-request {pr.number} --status=failed --with-job-details --output json 2>"$diagnostic_stderr"); then
                    collect_gitlab_failures "$gitlab_details_response"
                  else
                    diagnostic_payload='{{"checks":[],"truncated":true}}'
                    gitlab_trace_jobs=
                  fi
                fi
                ci_diagnostic "$diagnostic_reason"
                if [ "$diagnostic_reason" = ci_failed ]; then
                  log="$(git rev-parse --git-dir)/cruise-ci-traces.log"
                  : > "$log"
                  printf '%s\n' "$gitlab_trace_jobs" | while read -r pid jid; do
                    [ -n "$pid" ] && [ -n "$jid" ] || continue
                    printf '=== job %s (pipeline %s) ===\n' "$jid" "$pid" >> "$log"
                    glab ci trace "$jid" --pipeline-id "$pid" >> "$log" 2>&1 || true
                  done
                fi
                exit 1 ;;
            esac
            sleep 15
            attempt=$((attempt + 1))
          done
          if [ "$query_status" -ne 0 ]; then
            ci_diagnostic api_error
          else
            ci_diagnostic timeout
          fi
          echo "CI remained pending after 30 polls." >&2
          exit 1 ;;
        *)
          provider=github
          state=unobserved
          head_matches=unknown
          check_count=unknown
          http_status=unknown
          if ! expected_head=$(git rev-parse HEAD); then
            printf 'Unable to read local HEAD before checking GitHub CI.\n' >&2
            ci_diagnostic local_head_error
            exit 1
          fi
          if ! repository=$(gh repo view --json nameWithOwner --jq .nameWithOwner); then
            printf 'Unable to determine the GitHub repository for PR #%s.\n' {pr.number} >&2
            ci_diagnostic repository_query_error
            exit 1
          fi
          owner=$(printf '%s\n' "$repository" | cut -d/ -f1)
          name=$(printf '%s\n' "$repository" | cut -d/ -f2-)
          if [ -z "$owner" ] || [ -z "$name" ]; then
            printf 'Invalid GitHub repository name: %s\n' "$repository" >&2
            ci_diagnostic repository_invalid
            exit 1
          fi
          query='query($owner:String!,$name:String!,$number:Int!,$head:GitObjectID!) {{ repository(owner:$owner,name:$name) {{ pullRequest(number:$number) {{headRefOid}} object(oid:$head) {{... on Commit {{oid statusCheckRollup {{state contexts(first:1) {{totalCount}}}}}}}}}}}}'
          detail_query='query($owner:String!,$name:String!,$number:Int!,$head:GitObjectID!,$after:String) {{ repository(owner:$owner,name:$name) {{ pullRequest(number:$number) {{headRefOid}} object(oid:$head) {{... on Commit {{oid statusCheckRollup {{contexts(first:100,after:$after) {{totalCount pageInfo {{hasNextPage endCursor}} nodes {{__typename ... on CheckRun {{name status conclusion detailsUrl checkSuite {{status conclusion workflowRun {{databaseId}}}}}} ... on StatusContext {{context state targetUrl}}}}}}}}}}}}}}'
          suite_query='query($owner:String!,$name:String!,$number:Int!,$head:GitObjectID!,$after:String) {{ repository(owner:$owner,name:$name) {{ pullRequest(number:$number) {{headRefOid}} object(oid:$head) {{... on Commit {{oid checkSuites(first:100,after:$after) {{totalCount pageInfo {{hasNextPage endCursor}} nodes {{status conclusion workflowRun {{databaseId}}}}}}}}}}}}}}'
          deadline=$(( $(date +%s) + 1740 ))
          head_mismatch_since=
          ready_streak=0
          diagnostic_stderr="$(git rev-parse --git-dir)/cruise-ci-query.stderr"
          while :; do
            if response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f query="$query" 2>"$diagnostic_stderr"); then
              query_status=0
            else
              query_status=$?
            fi
            cat "$diagnostic_stderr" >&2
            if [ "$query_status" -ne 0 ]; then
              http_status=$(sed -n 's/.*HTTP \([12345][0123456789][0123456789]\).*/\1/p' "$diagnostic_stderr" | sed -n '1p')
              if [ -z "$http_status" ]; then http_status=unknown; fi
              printf 'GitHub CI query failed for PR #%s at expected HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic api_error
              exit 1
            fi
            if ! printf '%s' "$response" | jq -e '(.errors // []) | length == 0' >/dev/null; then
              printf 'GitHub CI query returned errors for PR #%s at expected HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic graphql_error
              exit 1
            fi
            if ! pr_head=$(printf '%s' "$response" | jq -er '.data.repository.pullRequest.headRefOid | strings'); then
              printf 'GitHub did not return the head for PR #%s.\n' {pr.number} >&2
              ci_diagnostic pr_head_missing
              exit 1
            fi
            if [ "$pr_head" != "$expected_head" ]; then
              head_matches=false
              if ! now=$(date +%s); then
                printf 'Unable to check the GitHub CI head propagation grace period for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                ci_diagnostic clock_error
                exit 1
              fi
              if [ -z "$head_mismatch_since" ]; then head_mismatch_since=$now; fi
              if [ "$now" -ge "$deadline" ] || [ "$((now - head_mismatch_since))" -ge 90 ]; then
                printf 'GitHub PR #%s head changed: expected %s, found %s.\n' {pr.number} "$expected_head" "$pr_head" >&2
                ci_diagnostic head_mismatch
                exit 1
              fi
              ready_streak=0
              printf 'Waiting for GitHub PR #%s head propagation: expected %s, found %s.\n' {pr.number} "$expected_head" "$pr_head"
              sleep 5
              continue
            fi
            head_matches=true
            head_mismatch_since=
            if ! rollup_head=$(printf '%s' "$response" | jq -er '.data.repository.object.oid | strings'); then
              printf 'GitHub did not return the expected commit object for PR #%s (HEAD %s).\n' {pr.number} "$expected_head" >&2
              ci_diagnostic rollup_head_missing
              exit 1
            fi
            if [ "$rollup_head" != "$expected_head" ]; then
              state=stale-rollup
              check_count=0
            else
              if ! has_rollup=$(printf '%s' "$response" | jq -er '.data.repository.object | has("statusCheckRollup")'); then
                printf 'GitHub omitted statusCheckRollup for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                ci_diagnostic malformed_rollup
                exit 1
              fi
              if [ "$has_rollup" != true ]; then
                printf 'GitHub returned malformed statusCheckRollup data for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                ci_diagnostic malformed_rollup
                exit 1
              fi
              rollup=$(printf '%s' "$response" | jq -c '.data.repository.object.statusCheckRollup')
              if [ "$rollup" = null ]; then
                state=not-registered
                check_count=0
              else
                if ! state=$(printf '%s' "$response" | jq -er '.data.repository.object.statusCheckRollup.state | strings'); then
                  printf 'GitHub returned malformed CI state for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                  state=unknown
                  ci_diagnostic invalid_ci_state
                  exit 1
                fi
                if ! check_count=$(printf '%s' "$response" | jq -er '.data.repository.object.statusCheckRollup.contexts.totalCount | numbers'); then
                  printf 'GitHub returned malformed CI check count for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                  check_count=unknown
                  ci_diagnostic invalid_check_count
                  exit 1
                fi
                if [ "$check_count" -eq 0 ]; then
                  state=no-checks
                fi
              fi
            fi
            poll_ready=false
            if [ "$check_count" -gt 0 ]; then
              case "$state" in
                SUCCESS)
                  github_actions_status
                  case "$actions_state" in
                    ready) poll_ready=true ;;
                    failed)
                      printf 'GitHub Actions workflow run failed for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                      state=FAILURE
                      collect_github_failures
                      ci_diagnostic ci_failed
                      exit 1 ;;
                  esac ;;
                FAILURE|ERROR)
                  printf 'GitHub CI failed for PR #%s: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' {pr.number} "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
                  collect_github_failures
                  ci_diagnostic ci_failed
                  exit 1 ;;
                PENDING|EXPECTED) ;;
                *)
                  printf 'GitHub returned unknown CI state for PR #%s: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' {pr.number} "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
                  ci_diagnostic unknown_state
                  exit 1 ;;
              esac
            fi
            if [ "$poll_ready" = true ]; then
              ready_streak=$((ready_streak + 1))
              if [ "$ready_streak" -ge 2 ]; then
                printf 'GitHub CI passed for HEAD %s (%s checks).\n' "$expected_head" "$check_count"
                exit 0
              fi
            else
              ready_streak=0
            fi
            if ! now=$(date +%s); then
              printf 'Unable to check the GitHub CI wait deadline for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic clock_error
              exit 1
            fi
            if [ "$now" -ge "$deadline" ]; then
              printf 'GitHub CI timed out: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
              ci_diagnostic timeout
              exit 1
            fi
            printf 'Waiting for GitHub CI: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count"
            sleep 5
          done ;;
      esac
  fix-ci-error:
    skip: prev.success
    allow_commit: true
    permission: full
    prompt: "{inputs.fix_ci_error_prompt}"
    if:
      file-changed: sync-base
    next: wait-ci
