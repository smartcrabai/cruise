inputs: [resolve_conflict_prompt, fix_ci_error_prompt]
steps:
  pr-ready:
    command: |-
      case "{pr.url}" in
        */-/merge_requests/*) glab mr update {pr.number} --ready ;;
        *) gh pr ready {pr.number} ;;
      esac
  sync-base:
    command: |-
      cruise internal sync-base {pr.number} --url {pr.url}
  resolve-conflict:
    skip: prev.success
    allow_commit: true
    permission: full
    prompt: "{inputs.resolve_conflict_prompt}"
  push-after-sync:
    command: |-
      git push
  wait-ci:
    timeout: 30m
    command: |-
      ci_diagnostic() {{
        diagnostic_state=$state
        case "$diagnostic_state" in
          unobserved|SUCCESS|FAILURE|ERROR|PENDING|EXPECTED|stale-rollup|not-registered|no-checks|success|failed|canceled|cancelled|skipped|running|pending|created|waiting_for_resource|preparing|scheduled|manual|unknown) ;;
          *) diagnostic_state=unknown ;;
        esac
        diagnostic_head_matches=$head_matches
        case "$diagnostic_head_matches" in
          true|false|unknown) ;;
          *) diagnostic_head_matches=unknown ;;
        esac
        diagnostic_check_count=$check_count
        case "$diagnostic_check_count" in
          ''|*[!0-9]*) diagnostic_check_count=unknown ;;
          *) if [ "${{#diagnostic_check_count}}" -gt 18 ]; then diagnostic_check_count=unknown; fi ;;
        esac
        diagnostic_http_status=$http_status
        case "$diagnostic_http_status" in
          [12345][0123456789][0123456789]) ;;
          *) diagnostic_http_status=unknown ;;
        esac
        printf 'CRUISE_CI_DIAGNOSTIC_V2 %s %s %s %s %s %s\n' "$provider" "$1" "$diagnostic_state" "$diagnostic_head_matches" "$diagnostic_check_count" "$diagnostic_http_status" >&2
      }}
      case "{pr.url}" in
        */-/merge_requests/*)
          provider=gitlab
          state=unobserved
          head_matches=unknown
          check_count=unknown
          http_status=unknown
          attempt=0
          diagnostic_stderr="$(git rev-parse --git-dir)/cruise-ci-query.stderr"
          while [ "$attempt" -lt 30 ]; do
            if response=$(glab ci get --merge-request {pr.number} --output json 2>"$diagnostic_stderr"); then
              query_status=0
            else
              query_status=$?
            fi
            cat "$diagnostic_stderr" >&2
            if [ "$query_status" -ne 0 ]; then
              http_status=$(sed -n -e 's/.*: \([12345][0123456789][0123456789]\) .*/\1/p' -e 's/^\([12345][0123456789][0123456789]\) [A-Z].*/\1/p' "$diagnostic_stderr" | sed -n '1p')
              if [ -z "$http_status" ]; then http_status=unknown; fi
            else
              http_status=unknown
            fi
            if status=$(printf '%s' "$response" | jq -r '.status'); then
              status_parse_status=0
            else
              status_parse_status=$?
            fi
            case "$status" in
              success|failed|canceled|cancelled|skipped|running|pending|created|waiting_for_resource|preparing|scheduled|manual) state=$status ;;
              *) state=unknown ;;
            esac
            case "$status" in
              success) exit 0 ;;
              running|pending|created|waiting_for_resource|preparing|scheduled) ;;
              *)
                if [ "$query_status" -ne 0 ]; then
                  diagnostic_reason=api_error
                elif [ "$status_parse_status" -ne 0 ] || [ -z "$status" ] || [ "$status" = null ]; then
                  diagnostic_reason=invalid_ci_state
                elif [ "$status" = failed ]; then
                  diagnostic_reason=ci_failed
                else
                  diagnostic_reason=unknown_state
                fi
                ci_diagnostic "$diagnostic_reason"
                log="$(git rev-parse --git-dir)/cruise-ci-traces.log"
                : > "$log"
                glab ci get --merge-request {pr.number} --status=failed --with-job-details --output json \
                  | jq -r '.id as $p | (.jobs // [])[] | select(.status == "failed") | "\($p) \(.id)"' \
                  | while read -r pid jid; do
                      echo "=== job $jid (pipeline $pid) ===" >> "$log"
                      glab ci trace "$jid" --pipeline-id "$pid" >> "$log" 2>&1 || true
                    done
                exit 1 ;;
            esac
            sleep 15
            attempt=$((attempt + 1))
          done
          if [ "$query_status" -ne 0 ]; then
            ci_diagnostic api_error
          else
            ci_diagnostic timeout
          fi
          echo "CI remained pending after 30 polls." >&2
          exit 1 ;;
        *)
          provider=github
          state=unobserved
          head_matches=unknown
          check_count=unknown
          http_status=unknown
          if ! expected_head=$(git rev-parse HEAD); then
            printf 'Unable to read local HEAD before checking GitHub CI.\n' >&2
            ci_diagnostic local_head_error
            exit 1
          fi
          if ! repository=$(gh repo view --json nameWithOwner --jq .nameWithOwner); then
            printf 'Unable to determine the GitHub repository for PR #%s.\n' {pr.number} >&2
            ci_diagnostic repository_query_error
            exit 1
          fi
          owner=$(printf '%s\n' "$repository" | cut -d/ -f1)
          name=$(printf '%s\n' "$repository" | cut -d/ -f2-)
          if [ -z "$owner" ] || [ -z "$name" ]; then
            printf 'Invalid GitHub repository name: %s\n' "$repository" >&2
            ci_diagnostic repository_invalid
            exit 1
          fi
          query='query($owner:String!,$name:String!,$number:Int!,$head:GitObjectID!) {{ repository(owner:$owner,name:$name) {{ pullRequest(number:$number) {{headRefOid}} object(oid:$head) {{... on Commit {{oid statusCheckRollup {{state contexts(first:1) {{totalCount}}}}}}}}}}}}'
          deadline=$(( $(date +%s) + 1740 ))
          diagnostic_stderr="$(git rev-parse --git-dir)/cruise-ci-query.stderr"
          while :; do
            if response=$(gh api graphql -f owner="$owner" -f name="$name" -F number={pr.number} -f head="$expected_head" -f query="$query" 2>"$diagnostic_stderr"); then
              query_status=0
            else
              query_status=$?
            fi
            cat "$diagnostic_stderr" >&2
            if [ "$query_status" -ne 0 ]; then
              http_status=$(sed -n 's/.*HTTP \([12345][0123456789][0123456789]\).*/\1/p' "$diagnostic_stderr" | sed -n '1p')
              if [ -z "$http_status" ]; then http_status=unknown; fi
              printf 'GitHub CI query failed for PR #%s at expected HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic api_error
              exit 1
            fi
            if ! printf '%s' "$response" | jq -e '(.errors // []) | length == 0' >/dev/null; then
              printf 'GitHub CI query returned errors for PR #%s at expected HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic graphql_error
              exit 1
            fi
            if ! pr_head=$(printf '%s' "$response" | jq -er '.data.repository.pullRequest.headRefOid | strings'); then
              printf 'GitHub did not return the head for PR #%s.\n' {pr.number} >&2
              ci_diagnostic pr_head_missing
              exit 1
            fi
            if [ "$pr_head" != "$expected_head" ]; then
              head_matches=false
              printf 'GitHub PR #%s head changed: expected %s, found %s.\n' {pr.number} "$expected_head" "$pr_head" >&2
              ci_diagnostic head_mismatch
              exit 1
            fi
            head_matches=true
            if ! rollup_head=$(printf '%s' "$response" | jq -er '.data.repository.object.oid | strings'); then
              printf 'GitHub did not return the expected commit object for PR #%s (HEAD %s).\n' {pr.number} "$expected_head" >&2
              ci_diagnostic rollup_head_missing
              exit 1
            fi
            if [ "$rollup_head" != "$expected_head" ]; then
              state=stale-rollup
              check_count=0
            else
              if ! has_rollup=$(printf '%s' "$response" | jq -er '.data.repository.object | has("statusCheckRollup")'); then
                printf 'GitHub omitted statusCheckRollup for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                ci_diagnostic malformed_rollup
                exit 1
              fi
              if [ "$has_rollup" != true ]; then
                printf 'GitHub returned malformed statusCheckRollup data for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                ci_diagnostic malformed_rollup
                exit 1
              fi
              rollup=$(printf '%s' "$response" | jq -c '.data.repository.object.statusCheckRollup')
              if [ "$rollup" = null ]; then
                state=not-registered
                check_count=0
              else
                if ! state=$(printf '%s' "$response" | jq -er '.data.repository.object.statusCheckRollup.state | strings'); then
                  printf 'GitHub returned malformed CI state for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                  state=unknown
                  ci_diagnostic invalid_ci_state
                  exit 1
                fi
                if ! check_count=$(printf '%s' "$response" | jq -er '.data.repository.object.statusCheckRollup.contexts.totalCount | numbers'); then
                  printf 'GitHub returned malformed CI check count for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
                  check_count=unknown
                  ci_diagnostic invalid_check_count
                  exit 1
                fi
                if [ "$check_count" -eq 0 ]; then
                  state=no-checks
                fi
              fi
            fi
            if [ "$check_count" -gt 0 ]; then
              case "$state" in
                SUCCESS)
                  printf 'GitHub CI passed for HEAD %s (%s checks).\n' "$expected_head" "$check_count"
                  exit 0 ;;
                FAILURE|ERROR)
                  printf 'GitHub CI failed for PR #%s: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' {pr.number} "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
                  ci_diagnostic ci_failed
                  exit 1 ;;
                PENDING|EXPECTED) ;;
                *)
                  printf 'GitHub returned unknown CI state for PR #%s: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' {pr.number} "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
                  ci_diagnostic unknown_state
                  exit 1 ;;
              esac
            fi
            if ! now=$(date +%s); then
              printf 'Unable to check the GitHub CI wait deadline for PR #%s at HEAD %s.\n' {pr.number} "$expected_head" >&2
              ci_diagnostic clock_error
              exit 1
            fi
            if [ "$now" -ge "$deadline" ]; then
              printf 'GitHub CI timed out: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count" >&2
              ci_diagnostic timeout
              exit 1
            fi
            printf 'Waiting for GitHub CI: expected HEAD %s, PR HEAD %s, rollup HEAD %s, state %s, checks %s.\n' "$expected_head" "$pr_head" "$rollup_head" "$state" "$check_count"
            sleep 5
          done ;;
      esac
  fix-ci-error:
    skip: prev.success
    allow_commit: true
    permission: full
    prompt: "{inputs.fix_ci_error_prompt}"
    if:
      file-changed: sync-base
    next: wait-ci
